<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Minhas Finanças">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- ☁️ Firebase (sincronização entre aparelhos) -->
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F9FAFB;
  --ink:#111827; --ink-soft:#6B7280; --ink-faint:#9CA3AF;
  --brand:#2563EB; --brand-dark:#1D4ED8; --brand-soft:#EFF6FF; --brand-mid:#3B82F6;
  --income:#16A34A; --income-soft:#DCFCE7;
  --expense:#DC2626; --expense-soft:#FEE2E2;
  --invest:#7C3AED; --invest-soft:#F3E8FF;
  --goal:#D97706; --goal-soft:#FEF3C7;
  --border:#E5E7EB; --border-soft:#F0F1F3;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --radius:14px; --radius-sm:10px;
  --side-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar (azul PlannerFin) ---------- */
.sidebar{
  width:var(--side-w);flex-shrink:0;background:linear-gradient(180deg,var(--brand),var(--brand-dark));color:#DBEAFE;
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;height:100vh;height:100dvh;z-index:40;
}
.nav{padding:14px 12px 6px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.9px;color:rgba(255,255,255,.55);padding:14px 12px 7px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;border-radius:10px;
  color:rgba(255,255,255,.82);font-size:13.5px;font-weight:600;text-align:left;transition:.15s;margin-bottom:3px
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.nav-item.active svg{opacity:1}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.15)}
.patrimonio-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:13px 14px}
.patrimonio-card .lbl{font-size:10.5px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.3px}
.patrimonio-card .val{font-size:18px;font-weight:800;color:#fff;margin-top:3px;letter-spacing:-.4px}

/* ---------- Main ---------- */
.main{flex:1;margin-left:var(--side-w);min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:#fff;
  border-bottom:1px solid var(--border);padding:12px 30px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap
}
.top-logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.4px;user-select:none}
.top-logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:grid;place-items:center;color:#fff;flex-shrink:0}
.top-logo .mark svg{width:15px;height:15px}
.top-logo b{color:var(--brand-dark);font-weight:800}
.top-logo span.lite{color:var(--brand-mid);font-weight:700}
.page-title{display:none}
.page-head{margin:0 0 18px}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-.5px}
.page-head p{font-size:13px;color:var(--ink-soft);font-weight:500;margin-top:3px}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.month-nav button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink-soft);transition:.15s}
.month-nav button:hover{background:var(--surface-2);color:var(--ink)}
.month-nav .mlabel{font-weight:700;font-size:13.5px;min-width:128px;text-align:center;text-transform:capitalize;cursor:pointer;border-radius:7px;padding:4px 6px;transition:.15s;user-select:none}
.month-nav .mlabel:hover{background:var(--surface-2)}
.month-nav .mlabel::after{content:"▾";font-size:10px;margin-left:5px;color:var(--ink-faint);vertical-align:1px}
.mpick-back{position:fixed;inset:0;z-index:60}
.mpick{position:absolute;z-index:61;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px;width:280px;animation:mpickIn .14s ease}
@keyframes mpickIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mpick-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mpick-head .nav{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft);font-size:18px;font-weight:700;transition:.12s}
.mpick-head .nav:hover{background:var(--surface-2);color:var(--ink)}
.mpick-title{flex:1;text-align:center;font-weight:800;font-size:14px;color:var(--ink);border-radius:8px;padding:7px;transition:.12s}
.mpick-title:hover{background:var(--surface-2)}
.mpick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mpick-grid button{padding:11px 0;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);transition:.12s}
.mpick-grid button:hover{background:var(--brand-soft);color:var(--brand-dark)}
.mpick-grid button.on{background:var(--brand);color:#fff}
.mpick-grid button.today:not(.on){box-shadow:inset 0 0 0 2px var(--brand)}
.mpick-foot{margin-top:10px;text-align:center}
.mpick-foot button{font-size:12px;font-weight:700;color:var(--brand-dark);padding:7px 12px;border-radius:8px;transition:.12s}
.mpick-foot button:hover{background:var(--brand-soft)}
.topbar-spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;font-weight:700;
  font-size:13px;transition:.15s;white-space:nowrap;border:1px solid transparent
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.35)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn-danger{background:var(--expense);color:#fff;border-color:var(--expense);box-shadow:0 1px 2px rgba(220,38,38,.3)}
.btn-danger:hover{filter:brightness(.94)}
.content{padding:24px 30px 60px;max-width:1240px;width:100%}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.dash-cols{grid-template-columns:1.4fr 1fr}
@media(max-width:860px){.dash-cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-head h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.card-head .sub{font-size:12px;color:var(--ink-soft);font-weight:500}

.stat{position:relative;padding:18px 20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.stat .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.stat .ico svg{width:19px;height:19px}
.stat .lbl{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.stat .val{font-size:25px;font-weight:800;letter-spacing:-.7px;line-height:1}
.stat .foot{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:7px}
.stat .badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
.stat .badge.up{background:var(--income-soft);color:var(--income)}
.stat .badge.down{background:var(--expense-soft);color:var(--expense)}
.stat .badge.flat{background:var(--surface-2);color:var(--ink-soft)}
.stat.clickable{cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .15s}
.stat.clickable:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(37,99,235,.14);transform:translateY(-1px)}
.stat .gohint{font-size:11px;font-weight:700;color:var(--brand);margin-top:7px;display:flex;align-items:center;gap:4px}
.ic-income{background:var(--income-soft);color:var(--income)}
.ic-expense{background:var(--expense-soft);color:var(--expense)}
.ic-brand{background:var(--brand-soft);color:var(--brand)}
.ic-invest{background:var(--invest-soft);color:var(--invest)}
.ic-goal{background:var(--goal-soft);color:var(--goal)}
.pos{color:var(--income)} .neg{color:var(--expense)}

/* ---------- Lists / tables ---------- */
.tx-row{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--border-soft)}
.tx-row:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:17px}
.tx-main{flex:1;min-width:0}
.tx-desc{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tx-val{font-weight:800;font-size:14px;white-space:nowrap}
.pill{font-size:10px;font-weight:700;padding:2.5px 9px;border-radius:20px;letter-spacing:.2px}
.pill-pend{background:var(--goal-soft);color:var(--goal)}
.pill-ok{background:var(--income-soft);color:var(--income)}
.pill-rec{background:var(--brand-soft);color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.row-actions{display:flex;gap:4px;opacity:1;transition:.15s}
.tx-row:hover .row-actions{opacity:1}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-faint);transition:.15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--expense-soft);color:var(--expense)}

.empty{text-align:center;padding:38px 20px;color:var(--ink-faint)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:10px}
.empty p{font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.empty span{font-size:12px}

/* progress */
.bar{height:8px;background:var(--border-soft);border-radius:20px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;transition:width .5s ease}
.bar2{display:flex;height:9px;background:var(--border-soft);border-radius:20px;overflow:hidden}
.bar2 i{display:block;height:100%;transition:width .5s ease}
.bar2 .seg-real{border-radius:20px 0 0 20px}
.bar2 .seg-agend{background-color:var(--c);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 4px,rgba(255,255,255,0) 4px 8px)}
.bar2 i:last-child{border-radius:0 20px 20px 0}
.bar2 i:only-child,.bar2 .seg-real:last-child{border-radius:20px}
.orc-badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}

/* segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-soft);transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* chips/filters */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);transition:.15s}
.chip:hover{border-color:var(--brand-mid);color:var(--brand)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* chips de meses (estilo PlannerFin) */
.mchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mchip{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);transition:.15s}
.mchip:hover{border-color:var(--brand-mid);color:var(--brand)}
.mchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.mchip-ano{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px 4px;font-size:12px;font-weight:800}
.mchip-ano button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink-soft);font-size:13px;transition:.12s}
.mchip-ano button:hover{background:var(--surface-2);color:var(--ink)}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--border-soft)}
tbody tr:hover{background:var(--surface-2)}
.t-right{text-align:right}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:460px;box-shadow:var(--shadow-lg);max-height:92vh;max-height:92dvh;overflow-y:auto;animation:pop .2s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px 22px 4px;display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.modal-body{padding:14px 22px 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;
  background:var(--surface-2);color:var(--ink);transition:.15s;font-weight:600
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.field .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.type-toggle button{padding:12px;border-radius:11px;font-weight:700;font-size:13.5px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink-soft);transition:.15s}
.type-toggle button.on-rec{background:var(--income-soft);border-color:var(--income);color:var(--income)}
.type-toggle button.on-desp{background:var(--expense-soft);border-color:var(--expense);color:var(--expense)}
.type-toggle button.on-trans{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.modal-foot{display:flex;gap:10px;margin-top:6px}
.modal-foot .btn{flex:1;justify-content:center;padding:12px}
.check{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;cursor:pointer}
.check input{width:auto;margin:0}
.check span{font-size:13px;font-weight:600}
.fat-row{display:flex;gap:7px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.fat-row input[type=month],.fat-row input.fval,.fat-row input.fcard{padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:12.5px;background:var(--surface-2);color:var(--ink);font-weight:600;min-width:0;width:auto}
.fat-row input.fcard{flex:1 1 120px}
.fat-row input[type=month]{flex:1.2}
.fat-row input.fval{flex:1;max-width:110px}
.fat-row input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.fat-chk{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border:1.5px solid var(--border);border-radius:9px;padding:8px 9px;cursor:pointer;white-space:nowrap}
.fat-chk input{width:auto;margin:0}
.fat-chk:has(input:checked){background:var(--income-soft);border-color:var(--income);color:var(--income)}

/* color picker */
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;transition:.15s;padding:0}
.colors button.on{border-color:var(--ink);transform:scale(1.08)}
.color-custom{position:relative;width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:.15s;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(from 90deg,#e2504e,#e5901c,#fbc02d,#16a06a,#00acc1,#3b8fd4,#5468d4,#8a6fe8,#d6489e,#e2504e)}
.color-custom.on{border-color:var(--ink);transform:scale(1.08)}
.color-custom input{position:absolute;inset:-4px;width:140%;height:140%;opacity:0;cursor:pointer;border:none;padding:0;background:none}
.color-custom svg{width:15px;height:15px;color:#fff;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45));pointer-events:none}

/* toast */
.toasts{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));right:16px;z-index:90;display:flex;flex-direction:column;gap:10px}
@media(max-width:560px){.toasts{left:12px;right:12px;align-items:center}.toast{max-width:100%}}
.toast{background:#111827;color:#fff;padding:13px 17px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slidein .25s ease;max-width:320px}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.ok svg{color:#4ADE80} .toast.err svg{color:#FCA5A5}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* mobile nav */
.mobile-nav{display:none}
.menu-btn{display:none}

/* responsive */
@media(max-width:1080px){
  .content{padding:22px 18px 80px}
  .topbar{padding:12px 18px}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:.25s;width:260px}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .menu-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--ink)}
  .topbar{gap:12px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}
  .scrim.show{display:block}
}
@media(max-width:560px){
  .month-nav .mlabel{min-width:96px;font-size:12.5px}
  .btn span.lbl{display:none}
  .btn{padding:9px 11px}
  .stat .val{font-size:21px}
  .top-logo{font-size:15px}
}
.hidden{display:none!important}

/* ---------- ☁️ Sincronização: tela de login + status ---------- */
.auth-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(140deg,#1E3A8A,#2563EB 55%,#1D4ED8);}
.auth-card{width:100%;max-width:384px;background:var(--surface);border-radius:18px;padding:30px 26px 26px;box-shadow:var(--shadow-lg);}
.auth-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:grid;place-items:center;color:#fff;margin-bottom:16px;box-shadow:0 6px 16px rgba(37,99,235,.4);}
.auth-card h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:3px;}
.auth-card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;line-height:1.45;}
.auth-card label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:13px 0 6px;}
.auth-card input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;background:var(--surface-2);color:var(--ink);}
.auth-card input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft);}
.auth-erro{color:var(--expense);font-size:13px;min-height:18px;margin-top:10px;font-weight:600;}
.auth-actions{display:flex;gap:10px;margin-top:14px;}
.auth-actions button{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:14.5px;transition:filter .15s;}
.auth-actions button:hover{filter:brightness(.97);}
.auth-actions .primary{background:var(--brand);color:#fff;}
.auth-actions .ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--border);}
.auth-hint{margin-top:14px;font-size:11.5px;color:var(--ink-faint);line-height:1.5;text-align:center;}
.cloud-bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:9px;}
.sync-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);color:var(--ink-soft);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
.sync-chip[data-state="ok"] .sync-dot{background:var(--income);}
.sync-chip[data-state="sync"] .sync-dot{background:var(--goal);animation:syncPulse 1s infinite;}
.sync-chip[data-state="off"] .sync-dot{background:var(--ink-faint);}
.sync-chip[data-state="err"] .sync-dot{background:var(--expense);}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.3}}
.acct-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 6px 5px 13px;box-shadow:var(--shadow);}
.acct-bar .em{font-size:12px;color:var(--ink-soft);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-bar button{font-size:12px;font-weight:700;color:var(--expense);background:var(--expense-soft);border-radius:999px;padding:5px 12px;}
@media(max-width:720px){.acct-bar .em{max-width:84px;}.cloud-bar{right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:6px;}}
/* ============ PlannerFin: componentes das novas telas ============ */
.page-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin:-52px 0 18px}
@media(max-width:860px){.page-actions{margin:0 0 16px;justify-content:flex-start}}
.btn-dark{background:#111827;color:#fff}
.btn-dark:hover{background:#1F2937}
.link-btn{font-size:12px;font-weight:700;color:var(--brand);transition:.12s}
.link-btn:hover{color:var(--brand-dark);text-decoration:underline}
.info-i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink-faint);color:var(--ink-faint);font-size:9.5px;font-weight:800;display:inline-grid;place-items:center;font-style:normal;cursor:help}
.mini-sel{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:700;background:var(--surface);color:var(--ink)}
.mini-sel:focus{outline:none;border-color:var(--brand)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--ink-faint)}
.search-box input{border:none;background:none;outline:none;font-size:12.5px;font-weight:600;color:var(--ink);width:100%;min-width:120px}
.switch-row{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch{width:36px;height:20px;border-radius:20px;background:var(--border);position:relative;transition:.18s;flex-shrink:0;display:inline-block}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on i{left:18px}

/* chips de escopo do dashboard */
.dash-top{display:flex;justify-content:flex-end;margin:-56px 0 16px}
@media(max-width:860px){.dash-top{margin:0 0 14px;justify-content:flex-start}}
.scope-chips{display:flex;gap:7px;flex-wrap:wrap}
.scope-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);transition:.15s}
.scope-chip svg{width:13px;height:13px}
.scope-chip:hover{border-color:var(--brand-mid);color:var(--brand)}
.scope-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scope-chip.periodo{background:var(--surface)}

/* KPI expansível */
.stat.kpi{padding-bottom:14px}
.kpi-chip{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;background:var(--brand-soft);color:var(--brand-dark);border-radius:8px;padding:4px 9px}
.kpi-exp{display:block;margin:8px auto 0;width:34px;height:18px;border-radius:7px;color:var(--ink-faint);display:grid;place-items:center;transition:.15s}
.kpi-exp:hover{background:var(--surface-2);color:var(--ink)}
.kpi-exp.flip svg{transform:rotate(180deg)}
.kpi-foot{display:none;border-top:1px solid var(--border-soft);margin-top:8px;padding-top:6px;max-height:150px;overflow-y:auto}
.kpi-foot.open{display:block}
.kpi-conta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.avatar-ini{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.avatar-ini.big{width:64px;height:64px;font-size:22px;background:rgba(255,255,255,.25);color:#fff;border:2px solid rgba(255,255,255,.5)}

/* tabela de transações */
.tx-table th{white-space:nowrap}
.tx-table td{vertical-align:middle}
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.pill-click{cursor:pointer;border:none;transition:.12s}
.pill-click:hover{filter:brightness(.93)}

/* matriz de orçamento / previsão */
.orc-wrap{overflow-x:auto;max-width:100%}
.orc-table,.prev-table{border-collapse:collapse;font-size:11.5px;min-width:100%}
.orc-table th,.prev-table th{position:sticky;top:0;background:var(--surface-2);z-index:2}
.orc-table .orc-mes{text-align:center;font-size:11px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:8px 6px;text-transform:none;letter-spacing:0}
.orc-table .orc-mes-atual{background:var(--brand-soft);color:var(--brand-dark)}
.orc-table .orc-sub{font-size:9px;font-weight:700;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right;text-transform:none;letter-spacing:0}
.orc-fixa{position:sticky;left:0;background:var(--surface);z-index:3;min-width:168px;border-right:1px solid var(--border);padding:8px 10px;text-align:left}
thead .orc-fixa{z-index:4;background:var(--surface-2)}
.orc-head-cat{font-size:11px;font-weight:800;color:var(--ink);text-transform:none;letter-spacing:0}
.orc-cel{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-size:11px}
.orc-cel.orc-fim{border-right:1px solid var(--border)}
.orc-cel.orc-atual{background:#EFF6FF66}
.orc-edit{cursor:pointer;transition:.1s}
.orc-edit:hover{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.orc-linha-cat:hover td{background:var(--surface-2)}
.orc-linha-cat:hover .orc-fixa{background:var(--surface-2)}
.orc-grp{font-size:11px}
.orc-linha-total td,.orc-total{background:#111827!important;color:#fff;border-bottom:none}
.orc-total-fixa{background:#111827!important;color:#fff}
.orc-linha-sobra td,.orc-sobra{background:#1F2937!important;color:#fff;border-bottom:none}
.orc-sobra-fixa{background:#1F2937!important;color:#fff}

/* previsão de saldo */
.prev-table th{font-size:9.5px;font-weight:700;color:var(--ink-faint);padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:0;text-transform:none}
.prev-table td{padding:8px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-size:11.5px}
.prev-fixa{position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--border);min-width:150px;text-align:left}
thead .prev-fixa{background:var(--surface-2);z-index:3}
.prev-mes:hover td{background:var(--surface-2)}
.prev-mes:hover .prev-fixa{background:var(--surface-2)}
.prev-mes-atual td{background:#EFF6FF88}
.prev-mes-atual .prev-fixa{background:#EFF6FF}
.prev-dia td{background:var(--surface-2)}
.prev-dia .prev-fixa{background:var(--surface-2)}
.prev-sim{cursor:pointer;color:var(--invest);transition:.1s}
.prev-sim:hover{background:var(--invest-soft);box-shadow:inset 0 0 0 1.5px var(--invest)}

/* cadastro / perfil */
.cat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--border-soft);border-radius:10px;margin-bottom:7px}
.btn-dashed{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px dashed var(--brand);border-radius:11px;color:var(--brand);font-size:13px;font-weight:700;background:none;transition:.15s}
.btn-dashed:hover{background:var(--brand-soft)}
.perfil-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--brand),var(--brand-mid));border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}

/* topbar direita */
.top-ico{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft);transition:.15s}
.top-ico:hover{background:var(--surface-2);color:var(--ink)}
.top-ico .bdg{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--expense);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.top-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;transition:.15s}
.top-avatar:hover{filter:brightness(.92)}
.gear-menu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:200px;animation:mpickIn .13s ease}
.gear-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left;transition:.12s}
.gear-menu button:hover{background:var(--surface-2)}

@media(max-width:900px){
  #dashRow2,#dashRow3,#cadRow2,#perfilCols,#cadCats,#cadCats2{grid-template-columns:1fr!important}
}

</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="patrimonio-card">
        <div class="lbl">Patrimônio total</div>
        <div class="val num" id="sidePatrimonio">R$ 0,00</div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="top-logo">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></div>

      </div>

      </div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-ghost" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span class="lbl">Excel</span></button>
      <button class="btn btn-primary" id="btnNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Novo lançamento</span></button>
      <button class="top-ico" id="topBell" title="Lembretes de vencimento"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bdg hidden" id="bellBadge"></span></button>
      <button class="top-ico" id="topGear" title="Cadastros"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="top-avatar" id="topAvatar" title="Perfil">?</button>

<!-- ☁️ tela de login (aparece só quando a nuvem está configurada) -->

  <div class="auth-card">
    <div class="auth-logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></div>

</div>

<script>
/* =====================================================================
   MINHAS FINANÇAS — app de controle financeiro pessoal (arquivo único)
   Dados salvos em localStorage. Backup/portabilidade via Excel e JSON.
===================================================================== */
"use strict";

/* ---------- storage (com fallback em memória) ---------- */
const STORE_KEY = "minhas_financas_v1";
let memStore = null;
function safeGet(){ try{ return localStorage.getItem(STORE_KEY); }catch(e){ return memStore; } }
function safeSet(v){ try{ localStorage.setItem(STORE_KEY, v); }catch(e){ memStore = v; } }

/* ---------- modelo de dados ---------- */
let DB = null;
function novoBanco(){
  return {
    contas:[
      {id:uid(), nome:"Conta Corrente", tipo:"Conta corrente", saldoInicial:0, cor:"#0C9A76", arquivada:false, consolidar:true},
      {id:uid(), nome:"Carteira", tipo:"Dinheiro", saldoInicial:0, cor:"#5468D4", arquivada:false, consolidar:true}
    ],
    categorias:[
      {id:uid(), nome:"Salário", tipo:"receita", cor:"#16A06A", icone:"💼"},
      {id:uid(), nome:"Freelance / Extra", tipo:"receita", cor:"#0C9A76", icone:"🧾"},
      {id:uid(), nome:"Rendimentos", tipo:"receita", cor:"#5468D4", icone:"📈"},
      {id:uid(), nome:"Outras receitas", tipo:"receita", cor:"#8A6FE8", icone:"➕"},
      {id:uid(), nome:"Alimentação", tipo:"despesa", cor:"#E2504E", icone:"🍽️"},
      {id:uid(), nome:"Moradia", tipo:"despesa", cor:"#E5901C", icone:"🏠"},
      {id:uid(), nome:"Transporte", tipo:"despesa", cor:"#3B8FD4", icone:"🚗"},
      {id:uid(), nome:"Saúde", tipo:"despesa", cor:"#16A06A", icone:"💊"},
      {id:uid(), nome:"Educação", tipo:"despesa", cor:"#5468D4", icone:"📚"},
      {id:uid(), nome:"Lazer", tipo:"despesa", cor:"#D6489E", icone:"🎉"},
      {id:uid(), nome:"Compras", tipo:"despesa", cor:"#C7641A", icone:"🛍️"},
      {id:uid(), nome:"Contas e serviços", tipo:"despesa", cor:"#7A8794", icone:"💡"},
      {id:uid(), nome:"Outras despesas", tipo:"despesa", cor:"#9AA7B2", icone:"📌"}
    ],
    transacoes:[],
    investimentos:[],
    orcamentos:[],   // {id, categoriaId, valorOrcado}
    objetivos:[],
    dividas:[],      // {id, nome, credor, valorTotal, valorPago, vencimento, cor, icone, modo, parcelasTotal, parcelasPagas, valorParcela, valorQuitacao}
    recorrencias:[]  // receitas/despesas fixas (v3)
  };
}
function carregar(){
  const raw = safeGet();
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB = novoBanco(); } }
  else { DB = novoBanco(); }
  // garante campos
  DB.contas ||= []; DB.categorias ||= []; DB.transacoes ||= [];
  DB.investimentos ||= []; DB.orcamentos ||= []; DB.objetivos ||= [];
  DB.dividas ||= [];
  DB.recorrencias ||= [];
  DB.cartoes ||= [];        // cartões de crédito (v5, estilo PlannerFin)
  DB.perfil ||= {};         // nome, profissão, renda, tema de cor
  DB.orcamentosMes ||= {};  // planejado por categoria e mês {catId:{"AAAA-MM":valor}}
  DB.simulacoes ||= {};     // simulações da Previsão de Saldo {"AAAA-MM-DD":{rec,desp}}
  // contas antigas: por padrão entram no saldo consolidado
  DB.contas.forEach(c=>{ if(c.consolidar===undefined) c.consolidar=true; });
  // dívidas antigas: modo padrão "valor único"
  DB.dividas.forEach(d=>{ d.modo ||= "simples"; if(d.modo==="cartao"){ d.faturas ||= []; d.faturas.forEach(f=>{ f.cartao ||= ""; }); } });
  DB.recorrencias.forEach(r=>{ r.puladas ||= []; });
  if(typeof DB.updatedAt!=="number") DB.updatedAt=0;
}
function salvar(){ if(!_aplicandoRemoto) DB.updatedAt = Date.now(); safeSet(JSON.stringify(DB)); renderSidebar(); nuvemAgendarEnvio(); }

/* ---------- utilidades ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function parseValor(str){
  if(typeof str==="number") return str;
  if(str==null) return 0;
  str = String(str).trim().replace(/[R$\s]/g,"");
  if(str.includes(",")) str = str.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(str)) str = str.replace(/\./g,""); // "1.500" = mil e quinhentos
  const n = parseFloat(str); return isNaN(n)?0:n;
}
function fmt(n){
  const v = Math.abs(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?"-R$ ":"R$ ")+v;
}
function fmtShort(n){
  const a=Math.abs(n);
  if(a>=1000000) return (n/1000000).toFixed(1).replace(".",",")+"M";
  if(a>=1000) return (n/1000).toFixed(1).replace(".",",")+"k";
  return Math.round(n).toString();
}
function hoje(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mesAtual(){ return hoje().slice(0,7); }

/* fallback encadeado das imagens de logo: tenta a próxima fonte e, ao esgotar,
   mostra o emblema (monograma na cor da marca). É global p/ uso no onerror. */
window.bankImgError=function(img){
  const fbs=(img.dataset.fb||"").split("|").filter(Boolean);
  if(fbs.length){
    const next=fbs.shift();
    img.dataset.fb=fbs.join("|");
    img.src=next;
  } else {
    const wrap=img.parentElement;
    if(wrap){
      wrap.style.background=wrap.dataset.cor||"#7A8794";
      wrap.style.border="none";
      wrap.innerHTML=wrap.dataset.mono?decodeURIComponent(wrap.dataset.mono):"";
    }
  }
};
/* texto legível (claro/escuro) sobre uma cor */
function corContraste(hex){
  const c=String(hex||"#888").replace("#",""); if(c.length<6) return "#fff";
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.6 ? "#111827" : "#fff";
}

/* ---------- cálculos ---------- */
/* delta que uma transação aplica ao saldo de UMA conta (considera transferências) */
function deltaConta(t,id){
  if(t.tipo==="transferencia"){
    if(t.contaDestinoId===id) return  (t.valor||0);
    if(t.contaId===id)        return -(t.valor||0);
    return 0;
  }
  if(t.contaId!==id) return 0;
  return t.tipo==="receita"? (t.valor||0) : -(t.valor||0);
}
/* a transação toca esta conta? (origem, destino ou conta normal) */
function tocaConta(t,id){ return t.contaId===id || (t.tipo==="transferencia" && t.contaDestinoId===id); }
function saldoConta(id){
  const c=getConta(id); if(!c) return 0;
  const h=hoje();
  let s=c.saldoInicial||0;
  // Saldo atual = só o que já aconteceu até hoje. Lançamentos com data futura
  // (mesmo marcados como efetivados) não entram no saldo até a data chegar.
  DB.transacoes.forEach(t=>{ if(tocaConta(t,id) && t.status==="efetivado" && t.data<=h) s+=deltaConta(t,id); });
  return s;
}
/* saldo previsto de uma conta no fim de um mês: realizado até hoje + projeção
   (agendados + efetivados) até o fim do mês escolhido. Para meses passados,
   corresponde ao saldo realizado no fim daquele mês. */
function saldoContaPrevisto(id, mk){
  const c=getConta(id); if(!c) return 0;
  const h=hoje();
  const fim=ultimoDiaMes(mk);
  let s=c.saldoInicial||0;
  DB.transacoes.forEach(t=>{
    if(!tocaConta(t,id) || t.data>fim) return;
    // Realizado (efetivado) sempre conta. Pendentes contam na PROJEÇÃO do mês
    // atual/futuro (fim>=hoje) — inclusive pendentes atrasados, com data já
    // passada, que seguem previstos até serem efetivados ou excluídos.
    // Em meses já encerrados (fim<hoje) mostra só o realizado.
    const conta = (t.status==="efetivado") || (fim>=h);
    if(conta) s+=deltaConta(t,id);
  });
  return s;
}
function saldoTotal(){ return DB.contas.filter(c=>!c.arquivada && c.consolidar!==false).reduce((a,c)=>a+saldoConta(c.id),0); }
function totalInvestido(){ return DB.investimentos.reduce((a,i)=>a+(i.valorAtual||0),0); }
function patrimonio(){ return saldoTotal()+totalInvestido(); }

/* ---- base do fluxo de caixa (consistente com o saldo consolidado das contas) ---- */
function contasConsolidadas(){ return DB.contas.filter(c=>!c.arquivada && c.consolidar!==false); }
/* saldo REALIZADO (só efetivado) das contas consolidadas até uma data, inclusive */
function saldoRealizadoAte(dataLimite){
  const ids=new Set(contasConsolidadas().map(c=>c.id));
  let s=contasConsolidadas().reduce((a,c)=>a+(c.saldoInicial||0),0);
  DB.transacoes.forEach(t=>{
    if(t.status!=="efetivado" || t.data>dataLimite) return;
    if(t.tipo==="transferencia"){
      if(ids.has(t.contaDestinoId)) s+=t.valor||0;
      if(ids.has(t.contaId))        s-=t.valor||0;
    } else if(ids.has(t.contaId)){
      s+= t.tipo==="receita"? t.valor : -t.valor;
    }
  });
  return s;
}
/* saldo do fluxo até uma data: realizado até hoje (= saldo consolidado) e, daí pra frente,
   projeção incluindo agendados. Em "hoje" o valor é exatamente o saldo consolidado. */
function saldoFluxoAte(dataLimite){
  const h=hoje();
  if(dataLimite<=h) return saldoRealizadoAte(dataLimite);
  const ids=new Set(contasConsolidadas().map(c=>c.id));
  let extra=0;
  DB.transacoes.forEach(t=>{
    // além do fim do período: ignora. efetivado já passado: já entrou em
    // saldoTotal(). Sobra a projeção: pendentes (inclusive atrasados, com data
    // já passada) + qualquer lançamento com data futura.
    if(t.data>dataLimite) return;
    if(t.data<=h && t.status==="efetivado") return;
    if(t.tipo==="transferencia"){
      if(ids.has(t.contaDestinoId)) extra+=t.valor||0;
      if(ids.has(t.contaId))        extra-=t.valor||0;
    } else if(ids.has(t.contaId)){
      extra+= t.tipo==="receita"? t.valor : -t.valor;
    }
  });
  return saldoTotal()+extra;
}
/* saldo consolidado previsto no fim de um mês (soma das contas consolidadas) */
function saldoTotalPrevisto(mk){ return saldoFluxoAte(ultimoDiaMes(mk)); }
/* uma transação entra no fluxo neste ponto? passado/hoje: só efetivado; futuro: tudo (projeção) */
function entraNoFluxo(t,h){ return (t.data>h) || (t.status==="efetivado" && t.data<=h); }

/* dívidas */
function dividaAberto(d){ return Math.max((d.valorTotal||0)-(d.valorPago||0),0); }
function dividaModoLabel(d){ return d.modo==="parcelado"?"Parcelada": d.modo==="cartao"?"Cartão de crédito":"Valor único"; }
function dividaDetalhe(d){
  if(d.modo==="parcelado") return `${Math.min(d.parcelasPagas||0,d.parcelasTotal||0)}/${d.parcelasTotal||0} parcelas · ${fmt(d.valorParcela||0)} cada`;
  if(d.modo==="cartao"){
    const fs=d.faturas||[];
    const cs=[...new Set(fs.map(f=>(f.cartao||"").trim()).filter(Boolean))];
    const pfx=cs.length?`${cs.length} ${cs.length>1?"cartões":"cartão"} · `:"";
    return `${pfx}${fs.length} fatura(s) · ${fs.filter(f=>f.paga).length} paga(s)`;
  }
  return "";
}
/* Quitação à vista (dívida parcelada): valor informado para liquidar tudo hoje,
   já com os juros futuros amortizados. Retorna null quando não se aplica. */
function dividaQuitacao(d){
  if(!d || d.modo!=="parcelado") return null;
  const valor=+d.valorQuitacao||0;
  if(valor<=0) return null;
  const nominalRestante=dividaAberto(d);          // soma das parcelas que ainda faltam
  if(nominalRestante<=0) return null;             // já está quitada
  return { valor, nominal:nominalRestante, economia:Math.max(nominalRestante-valor,0) };
}
function totalDividasAberto(){ return (DB.dividas||[]).reduce((a,d)=>a+dividaAberto(d),0); }
function totalDividasQuitado(){ return (DB.dividas||[]).reduce((a,d)=>a+Math.min(d.valorPago||0,d.valorTotal||0),0); }

/* Estado do orçamento de uma categoria (ou do total), com base no comprometido = realizado + agendado. */
function estadoOrcamento(real, agend, o){
  const comp = real + agend;
  if(o<=0) return { nivel:"sem", pct:0, comp, excedente:0, cor:"var(--ink-soft)", corTexto:"var(--ink)", txt:"sem limite" };
  const pct = comp/o*100;
  const jaGastou = real > o;
  if(comp > o) return { nivel:"estourou", pct, comp, excedente:comp-o, jaGastou, cor:"var(--expense)", corTexto:"var(--expense)", txt: jaGastou?"já passou do limite":"vai passar do limite" };
  if(pct >= 80) return { nivel:"perto", pct, comp, excedente:0, cor:"var(--goal)", corTexto:"#B9700F", txt:"perto do limite" };
  return { nivel:"ok", pct, comp, excedente:0, cor:"var(--brand)", corTexto:"var(--ink)", txt:"dentro do orçamento" };
}
function badgeOrcamento(st){
  if(st.nivel==="estourou") return `<span class="orc-badge" style="background:var(--expense-soft);color:var(--expense)">⛔ ${st.jaGastou?"Acima do limite":"Vai ultrapassar"}</span>`;
  if(st.nivel==="perto")    return `<span class="orc-badge" style="background:var(--goal-soft);color:#B9700F">⚠️ Perto do limite</span>`;
  return "";
}
// Barra com dois segmentos: realizado (sólido) + agendado (hachurado).
function barraDupla(real, agend, o, st){
  let realPct, agendPct;
  if(o > 0){ realPct = Math.min(real/o*100, 100); agendPct = Math.min(agend/o*100, Math.max(0, 100-realPct)); }
  else { const tot = (real+agend) || 1; realPct = real/tot*100; agendPct = agend/tot*100; }
  const cor = st.cor;
  return `<div class="bar2">
    <i class="seg-real" style="width:${realPct}%;background:${cor}"></i>
    <i class="seg-agend" style="width:${agendPct}%;--c:${cor}"></i>
  </div>`;
}

    </div>

}

/* fluxo de caixa diário (realizado até hoje + projeção dos agendados a partir daí) */
function fluxoDiario(mk){
  const h=hoje();
  const ids=new Set(contasConsolidadas().map(c=>c.id));
  const n=diasNoMes(mk), out=[];
  for(let d=1; d<=n; d++){
    const dia=`${mk}-${String(d).padStart(2,"0")}`;
    const td=DB.transacoes.filter(t=>(ids.has(t.contaId) || (t.tipo==="transferencia" && ids.has(t.contaDestinoId))) && t.data===dia && entraNoFluxo(t,h));
    const rec=td.filter(t=>t.tipo==="receita").reduce((a,t)=>a+t.valor,0);
    const desp=td.filter(t=>t.tipo==="despesa").reduce((a,t)=>a+t.valor,0);
    // transferências que cruzam a fronteira do consolidado (entra/sai dinheiro do total)
    let transf=0;
    td.forEach(t=>{
      if(t.tipo!=="transferencia") return;
      const entra=ids.has(t.contaDestinoId), sai=ids.has(t.contaId);
      if(entra && !sai) transf+=t.valor||0;
      if(sai && !entra) transf-=t.valor||0;
    });
    out.push({dia:d,rec,desp,transf,saldo:saldoFluxoAte(dia),tx:td});
  }
  return out;
}
/* fluxo mensal de um ano (mesma base do saldo consolidado) */
function fluxoMensal(ano){
  const h=hoje();
  const ids=new Set(contasConsolidadas().map(c=>c.id));
  const out=[];
  for(let m=1; m<=12; m++){
    const mk=`${ano}-${String(m).padStart(2,"0")}`;
    const fimMes=`${mk}-${String(diasNoMes(mk)).padStart(2,"0")}`;
    const mtx=DB.transacoes.filter(t=>ids.has(t.contaId) && t.data.slice(0,7)===mk && entraNoFluxo(t,h));
    const rec=mtx.filter(t=>t.tipo==="receita").reduce((a,t)=>a+t.valor,0);
    const desp=mtx.filter(t=>t.tipo==="despesa").reduce((a,t)=>a+t.valor,0);
    out.push({mes:m,mk,rec,desp,saldo:saldoFluxoAte(fimMes)});
  }
  return out;
}

/* ====================================================================
   RECORRÊNCIAS — receitas e despesas fixas (v3)
   Cada regra "materializa" lançamentos (agendados por padrão) que
   entram no fluxo de caixa, dashboard e transações normalmente.
==================================================================== */
const FREQS={
  mensal:{nome:"Mensal", mesesPasso:1},
  semanal:{nome:"Semanal"},
  quinzenal:{nome:"Quinzenal"},
  bimestral:{nome:"Bimestral", mesesPasso:2},
  trimestral:{nome:"Trimestral", mesesPasso:3},
  semestral:{nome:"Semestral", mesesPasso:6},
  anual:{nome:"Anual", mesesPasso:12}
};
function toIsoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDias(iso,n){ const dt=new Date(iso+"T00:00:00"); dt.setDate(dt.getDate()+n); return toIsoDate(dt); }
/* soma n meses a uma data ISO completa, ajustando o dia ao último do mês quando preciso */
function addMesData(iso,n){
  const [y,m,d]=iso.split("-").map(Number);
  let ny=y, nm=m+n; while(nm<1){nm+=12;ny--;} while(nm>12){nm-=12;ny++;}
  const ult=new Date(ny,nm,0).getDate();
  return `${ny}-${String(nm).padStart(2,"0")}-${String(Math.min(d,ult)).padStart(2,"0")}`;
}
function ultimoDiaMes(mk){ return `${mk}-${String(diasNoMes(mk)).padStart(2,"0")}`; }
function maxMes(a,b){ return a>=b?a:b; }
function equivMensal(r){
  const f={mensal:1,semanal:52/12,quinzenal:26/12,bimestral:1/2,trimestral:1/3,semestral:1/6,anual:1/12}[r.frequencia]||1;
  return (r.valor||0)*f;
}
/* gera as datas de ocorrência de uma regra, do início até 'ateIso' */
function ocorrenciasRegra(r, ateIso){
  const out=[];
  const inicio=r.dataInicio;
  const limite=(r.dataFim && r.dataFim<ateIso)? r.dataFim : ateIso;
  if(!inicio || inicio>limite) return out;
  if(r.frequencia==="semanal" || r.frequencia==="quinzenal"){
    const passo=r.frequencia==="semanal"?7:14;
    let cur=inicio, guard=0;
    while(cur<=limite && guard++<2000){ out.push(cur); cur=addDias(cur,passo); }
  } else {
    const passo=(FREQS[r.frequencia]&&FREQS[r.frequencia].mesesPasso)||1;
    const [iy,im]=inicio.split("-").map(Number);
    const dia=r.diaBase||Number(inicio.split("-")[2]);
    let y=iy, m=im, guard=0;
    while(guard++<2400){
      const ult=new Date(y,m,0).getDate();
      const iso=`${y}-${String(m).padStart(2,"0")}-${String(Math.min(dia,ult)).padStart(2,"0")}`;
      if(iso>limite) break;
      if(iso>=inicio) out.push(iso);
      m+=passo; while(m>12){m-=12;y++;}
    }
  }
  return out;
}
function proximaOcorrencia(r){
  if(!r.ativa) return null;
  const horizon=ultimoDiaMes(addMes(mesAtual(),18));
  const h=hoje();
  for(const d of ocorrenciasRegra(r,horizon)){ if(d>=h && !(r.puladas&&r.puladas.includes(d))) return d; }
  return null;
}
/* remove lançamentos gerados ainda não confirmados a partir de hoje */
function limparFuturosPendentes(ruleId){
  const h=hoje();
  DB.transacoes=DB.transacoes.filter(t=>!(t.recorrenciaId===ruleId && t.status==="pendente" && (t.competencia||t.data)>=h));
}
/* cria os lançamentos que ainda não existem (idempotente) */
function sincronizarRecorrencias(){
  if(!DB.recorrencias || !DB.recorrencias.length) return false;
  const base=maxMes(mesAtual(), (typeof state!=="undefined" && state.mes)||mesAtual());
  const horizonte=ultimoDiaMes(addMes(base,12));
  let mudou=false;
  const existentes=new Set(DB.transacoes.filter(t=>t.recorrenciaId).map(t=>t.recorrenciaId+"|"+(t.competencia||t.data)));
  DB.recorrencias.forEach(r=>{
    if(!r.ativa) return;
    ocorrenciasRegra(r,horizonte).forEach(iso=>{
      if(r.puladas && r.puladas.includes(iso)) return;
      const key=r.id+"|"+iso;
      if(existentes.has(key)) return;
      DB.transacoes.push({
        id:uid(), tipo:r.tipo, valor:r.valor, descricao:r.descricao,
        categoriaId:r.categoriaId, contaId:r.contaId, data:iso,
        status:r.lancarStatus||"pendente",
        recorrenciaId:r.id, competencia:iso, recorrente:true
      });
      existentes.add(key); mudou=true;
    });
  });
  return mudou;
}
function proximoInicio(dataIso, freq){
  if(freq==="semanal") return addDias(dataIso,7);
  if(freq==="quinzenal") return addDias(dataIso,14);
  const passo=(FREQS[freq]&&FREQS[freq].mesesPasso)||1;
  const [y,m,d]=dataIso.split("-").map(Number);
  let ny=y, nm=m+passo; while(nm>12){nm-=12;ny++;}
  const ult=new Date(ny,nm,0).getDate();
  return `${ny}-${String(nm).padStart(2,"0")}-${String(Math.min(d,ult)).padStart(2,"0")}`;
}
/* transforma um lançamento avulso em uma regra fixa (próximos períodos).
   dataFim opcional: define repetição por período determinado (null = para sempre). */
function criarRecorrenciaDeLancamento(tx, freq, dataFim){
  const r={ id:uid(), tipo:tx.tipo, valor:tx.valor, descricao:tx.descricao,
    categoriaId:tx.categoriaId, contaId:tx.contaId, frequencia:freq,
    diaBase:Number(tx.data.split("-")[2]),
    dataInicio:proximoInicio(tx.data, freq), dataFim:dataFim||null,
    lancarStatus:"pendente", ativa:true, puladas:[] };
  DB.recorrencias.push(r);
  tx.recorrenciaId=r.id; tx.competencia=tx.data; tx.recorrente=true;
  return r;
}
/* Edita uma ocorrência de recorrência conforme o escopo:
   'uma'     → altera apenas este mês (vira um override fixado, não regenerado)
   'futuras' → altera deste mês em diante, dividindo a série em uma nova regra */
function editarRecorrenteOcorrencia(t, campos, escopo){
  const comp=t.competencia||t.data;
  const i=DB.transacoes.findIndex(x=>x.id===t.id);
  if(escopo!=="futuras"){
    DB.transacoes[i]={ ...t, ...campos, competencia:comp, recorrenciaId:t.recorrenciaId, recorrente:true, editadoManual:true };
    return "Alteração aplicada apenas a este mês.";
  }
  const R=DB.recorrencias.find(x=>x.id===t.recorrenciaId);
  if(!R){ DB.transacoes[i]={ ...t, ...campos }; return "Lançamento atualizado."; }
  const origFim=R.dataFim||null;
  // 1) encerra a regra antiga imediatamente antes desta competência
  R.dataFim=addDias(comp,-1);
  // 2) remove as ocorrências pendentes da regra antiga a partir desta competência (menos a atual)
  DB.transacoes=DB.transacoes.filter(x=>!(x.recorrenciaId===R.id && x.id!==t.id && x.status==="pendente" && (x.competencia||x.data)>=comp));
  // 3) cria a nova regra com os valores editados, ancorada nesta competência
  const ym=comp.slice(0,7);
  const dia=Number((campos.data||comp).split("-")[2])||Number(comp.split("-")[2]);
  const start=`${ym}-${String(Math.min(dia,diasNoMes(ym))).padStart(2,"0")}`;
  const N={ id:uid(), tipo:campos.tipo, valor:campos.valor, descricao:campos.descricao,
    categoriaId:campos.categoriaId, contaId:campos.contaId,
    frequencia:R.frequencia, diaBase:dia, dataInicio:start, dataFim:origFim,
    lancarStatus:R.lancarStatus||"pendente", ativa:true,
    puladas:(R.puladas||[]).filter(p=>p>=start) };
  // não recriar meses que já tenham um lançamento efetivado da regra antiga
  const mesesOcupados=new Set(DB.transacoes
    .filter(x=>x.recorrenciaId===R.id && x.id!==t.id && (x.competencia||x.data)>=comp)
    .map(x=>(x.competencia||x.data).slice(0,7)));
  ocorrenciasRegra(N, ultimoDiaMes(addMes(mesAtual(),18))).forEach(iso=>{ if(mesesOcupados.has(iso.slice(0,7)) && !N.puladas.includes(iso)) N.puladas.push(iso); });
  DB.recorrencias.push(N);
  // 4) a ocorrência atual passa a pertencer à nova regra
  const j=DB.transacoes.findIndex(x=>x.id===t.id);
  DB.transacoes[j]={ ...t, ...campos, data:start, competencia:start, recorrenciaId:N.id, recorrente:true };
  // 5) descarta a regra antiga se não restou histórico nem ocorrências
  const temHist=DB.transacoes.some(x=>x.recorrenciaId===R.id);
  const temOcc=ocorrenciasRegra(R, ultimoDiaMes(addMes(mesAtual(),18))).some(d=>!(R.puladas&&R.puladas.includes(d)));
  if(!temHist && !temOcc) DB.recorrencias=DB.recorrencias.filter(x=>x.id!==R.id);
  sincronizarRecorrencias();
  return "Alteração aplicada deste mês em diante.";
}
/* encerra a série de uma recorrência a partir de uma ocorrência (inclui-a):
   remove a ocorrência atual e os futuros pendentes, e fecha a regra. */
function excluirRecorrenteSerie(t){
  const comp=t.competencia||t.data;
  const R=DB.recorrencias.find(x=>x.id===t.recorrenciaId);
  if(R){ R.dataFim=addDias(comp,-1); if(R.dataFim<R.dataInicio) R.ativa=false; }
  DB.transacoes=DB.transacoes.filter(x=>!(x.recorrenciaId===t.recorrenciaId && x.status==="pendente" && (x.competencia||x.data)>=comp));
  // se a regra ficou sem histórico e sem ocorrências, descarta
  if(R){
    const temHist=DB.transacoes.some(x=>x.recorrenciaId===R.id);
    const temOcc=ocorrenciasRegra(R, ultimoDiaMes(addMes(mesAtual(),18))).some(d=>!(R.puladas&&R.puladas.includes(d)));
    if(!temHist && !temOcc) DB.recorrencias=DB.recorrencias.filter(x=>x.id!==R.id);
  }
}
/* exclui só esta ocorrência (mantém a recorrência ativa, pulando esta data) */
function excluirRecorrenteUma(t){
  const r=DB.recorrencias.find(x=>x.id===t.recorrenciaId);
  if(r){ r.puladas=r.puladas||[]; const k=t.competencia||t.data; if(!r.puladas.includes(k)) r.puladas.push(k); }
  DB.transacoes=DB.transacoes.filter(x=>x.id!==t.id);
}
/* primeira ocorrência (iso) de uma regra dentro do mês ym (YYYY-MM) */
function ocorrenciaNoMes(R, ym){
  const occ=ocorrenciasRegra(R, ultimoDiaMes(ym)).filter(d=>d.slice(0,7)===ym);
  if(occ.length) return occ[occ.length-1];
  const dia=R.diaBase||Number((R.dataInicio||hoje()).split("-")[2]);
  return `${ym}-${String(Math.min(dia,diasNoMes(ym))).padStart(2,"0")}`;
}
/* fim de uma duração {modo:'sempre'|'periodo', qtd, unid} a partir de baseIso (null = sempre) */
function calcFimDuracao(baseIso, dur){
  if(!dur || dur.modo!=="periodo") return null;
  const q=parseInt(dur.qtd)||0; if(q<=0) return null;
  const meses=dur.unid==="anos"?q*12:q;
  return addDias(addMesData(baseIso, meses), -1);
}
/* reidrata a duração de uma regra existente para preencher o formulário */
function duracaoDeRegra(R){
  if(!R.dataFim) return {modo:"sempre", qtd:12, unid:"meses"};
  const fimMais1=addDias(R.dataFim,1);
  const [ay,am]=R.dataInicio.split("-").map(Number);
  const [by,bm]=fimMais1.split("-").map(Number);
  let meses=(by-ay)*12+(bm-am);
  if(meses<1) meses=1;
  if(meses%12===0) return {modo:"periodo", qtd:meses/12, unid:"anos"};
  return {modo:"periodo", qtd:meses, unid:"meses"};
}
/* aplica a edição de uma regra conforme o escopo escolhido na tela Fixas e Recorrentes */
function aplicarEdicaoRegra(R, campos, dur, escopo, mesRef){
  if(escopo==="mes"){
    const comp=ocorrenciaNoMes(R, mesRef);
    let tx=DB.transacoes.find(x=>x.recorrenciaId===R.id && (x.competencia||x.data)===comp);
    if(!tx){ tx={id:uid(), tipo:R.tipo, valor:R.valor, descricao:R.descricao, categoriaId:R.categoriaId, contaId:R.contaId, data:comp, status:R.lancarStatus||"pendente", recorrenciaId:R.id, competencia:comp, recorrente:true}; DB.transacoes.push(tx); }
    editarRecorrenteOcorrencia(tx, {tipo:campos.tipo, valor:campos.valor, descricao:campos.descricao, categoriaId:campos.categoriaId, contaId:campos.contaId, data:tx.data, status:tx.status}, "uma");
    return "Alteração aplicada apenas ao mês escolhido.";
  }
  if(escopo==="futuras"){
    const comp=ocorrenciaNoMes(R, mesRef);
    R.dataFim=addDias(comp,-1);
    DB.transacoes=DB.transacoes.filter(x=>!(x.recorrenciaId===R.id && x.status==="pendente" && (x.competencia||x.data)>=comp));
    const ym=comp.slice(0,7);
    const dia=Number(campos.dataInicio.split("-")[2])||Number(comp.split("-")[2]);
    const start=`${ym}-${String(Math.min(dia,diasNoMes(ym))).padStart(2,"0")}`;
    const N={ id:uid(), tipo:campos.tipo, valor:campos.valor, descricao:campos.descricao,
      categoriaId:campos.categoriaId, contaId:campos.contaId, frequencia:campos.frequencia,
      diaBase:dia, dataInicio:start, dataFim:calcFimDuracao(start,dur), lancarStatus:campos.lancarStatus, ativa:true,
      puladas:(R.puladas||[]).filter(p=>p>=start) };
    DB.recorrencias.push(N);
    const temHist=DB.transacoes.some(x=>x.recorrenciaId===R.id);
    const temOcc=ocorrenciasRegra(R, ultimoDiaMes(addMes(mesAtual(),18))).some(d=>!(R.puladas&&R.puladas.includes(d)));
    if(!temHist && !temOcc) DB.recorrencias=DB.recorrencias.filter(x=>x.id!==R.id);
    sincronizarRecorrencias();
    return "Alteração aplicada deste mês em diante.";
  }
  // série inteira
  const ini=campos.dataInicio;
  const i=DB.recorrencias.findIndex(x=>x.id===R.id);
  DB.recorrencias[i]={ id:R.id, tipo:campos.tipo, valor:campos.valor, descricao:campos.descricao,
    categoriaId:campos.categoriaId, contaId:campos.contaId, frequencia:campos.frequencia,
    dataInicio:ini, dataFim:calcFimDuracao(ini,dur), diaBase:Number(ini.split("-")[2]),
    lancarStatus:campos.lancarStatus, ativa:R.ativa, puladas:R.puladas||[] };
  limparFuturosPendentes(R.id);
  sincronizarRecorrencias();
  return "Recorrência atualizada (série inteira).";
}

function somaCatMes(catId,mk,tipo,incluirPend){

function planejadoTotalMes(mk,tipo){

/* simulações da Previsão de Saldo: valores hipotéticos por dia */
function simDe(dia){ const s=(DB.simulacoes||{})[dia]||{}; return {rec:+s.rec||0, desp:+s.desp||0}; }
function simsAcumAte(dia){
  let a=0;
  Object.entries(DB.simulacoes||{}).forEach(([d,s])=>{ if(d<=dia) a+=(+s.rec||0)-(+s.desp||0); });
  return a;
}
function simsDoMes(mk){
  let rec=0,desp=0;
  Object.entries(DB.simulacoes||{}).forEach(([d,s])=>{ if(d.slice(0,7)===mk){ rec+=+s.rec||0; desp+=+s.desp||0; } });
  return {rec,desp};
}

/* lembretes de vencimento: agendados atrasados + próximos N dias */
function diasEntre(isoA, isoB){
  const a=new Date(isoA+"T00:00:00"), b=new Date(isoB+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function lembretes(janelaDias=7){
  const h=hoje(), limite=addDias(h,janelaDias);
  return DB.transacoes
    .filter(t=>t.status==="pendente" && t.tipo!=="transferencia" && t.data<=limite)
    .sort((a,b)=>a.data.localeCompare(b.data))
    .map(t=>{ const d=diasEntre(h,t.data); return {t, d, cls: d<0?"atrasado":(d===0?"hoje":"proximo")}; });
}
function iconBell(){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';}
function lembreteRow(item){

  else if(cls==="hoje"){ quando= isRec?"entra hoje":"vence hoje"; }
  else { quando= isRec?`a receber em ${d} dia${d>1?"s":""}`:`vence em ${d} dia${d>1?"s":""}`; }
  return `<div class="tx-row" style="border-left:3px solid ${accent};padding-left:11px;border-radius:0 8px 8px 0">
    <div class="tx-ico" style="background:${catCor(t.categoriaId)}1f">${catIcone(t.categoriaId)}</div>
    <div class="tx-main">
      <div class="tx-desc">${escapeHtml(t.descricao||catNome(t.categoriaId))}</div>
      <div class="tx-meta">
        <span style="color:${accent};font-weight:700">${quando}</span><span>·</span><span>${dataBR(t.data)}</span><span>·</span><span>${contaNome(t.contaId)}</span>
        ${t.recorrente?'<span class="pill pill-rec">Fixa</span>':''}
      </div>
    </div>
    <div class="tx-val ${isRec?"pos":"neg"}">${isRec?"+":"−"}${fmt(t.valor).replace("-","")}</div>
    <div class="row-actions" style="opacity:1">
      <button class="icon-btn" data-efetivar="${t.id}" title="${isRec?"Confirmar recebimento":"Confirmar pagamento"}"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
      <button class="icon-btn" data-edit-tx="${t.id}" title="Editar"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
  </div>`;
}
function cardLembretes(){
  const items=lembretes(7);

  const nAtraso=items.filter(i=>i.cls==="atrasado").length;

      ${aReceber>0?`<div><div style="font-size:11px;color:var(--ink-soft);font-weight:600">A receber</div><div class="num pos" style="font-size:17px;font-weight:800">${fmt(aReceber)}</div></div>`:""}

}

/* Resumo Real x Orçado do mês no Painel (versão compacta da aba Orçamento) */
function cardRealOrcado(mk){
  const cats=DB.categorias.filter(c=>c.tipo==="despesa");
  const totalOrc=cats.reduce((a,c)=>a+orcadoCat(c.id),0);
  const totalReal=cats.reduce((a,c)=>a+realizadoCat(c.id,mk),0);
  const totalAgend=cats.reduce((a,c)=>a+agendadoCat(c.id,mk),0);
  const st=estadoOrcamento(totalReal,totalAgend,totalOrc);
  const disp=totalOrc-totalReal-totalAgend;
  const linhas=cats.filter(c=>orcadoCat(c.id)>0 || realizadoCat(c.id,mk)>0 || agendadoCat(c.id,mk)>0)
    .sort((a,b)=>(realizadoCat(b.id,mk)+agendadoCat(b.id,mk))-(realizadoCat(a.id,mk)+agendadoCat(a.id,mk)))
    .map(c=>rowRealOrcado(c,mk)).join("");
  return `
  <div class="card card-pad" style="margin-top:16px">
    <div class="card-head">
      <h3 style="display:flex;align-items:center;gap:8px">Real x Orçado ${badgeOrcamento(st)}</h3>
      <button class="btn btn-ghost" data-goto="orcamento" style="padding:7px 12px">Ver orçamento</button>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);font-weight:600;margin:-2px 0 12px">${nomeMes(mk)}</div>
    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:baseline">
      <div><div style="font-size:11.5px;color:var(--ink-soft);font-weight:600">Orçado</div><div class="num" style="font-size:22px;font-weight:800">${fmt(totalOrc)}</div></div>
      <div><div style="font-size:11.5px;color:var(--ink-soft);font-weight:600">Realizado</div><div class="num" style="font-size:22px;font-weight:800">${fmt(totalReal)}</div></div>
      ${totalAgend>0?`<div><div style="font-size:11.5px;color:var(--ink-soft);font-weight:600">Agendado</div><div class="num" style="font-size:22px;font-weight:800;color:var(--goal)">${fmt(totalAgend)}</div></div>`:""}
      <div><div style="font-size:11.5px;color:var(--ink-soft);font-weight:600">Disponível</div><div class="num ${disp<0?"neg":"pos"}" style="font-size:22px;font-weight:800">${fmt(disp)}</div></div>
    </div>
    <div style="margin-top:12px">${barraDupla(totalReal,totalAgend,totalOrc,st)}</div>
    <div style="font-size:12px;color:${totalOrc>0?st.corTexto:"var(--ink-faint)"};font-weight:600;margin-top:6px">${totalOrc>0?`${st.pct.toFixed(0)}% comprometido — ${st.txt}${st.excedente>0?` (${fmt(st.excedente)} acima do orçamento)`:""}`:"Nenhum limite definido ainda"}</div>
    ${totalOrc===0 && totalReal===0 && totalAgend===0
      ? emptyMini("Sem orçamento neste mês","Defina limites por categoria na aba Orçamento.")
      : `<div style="margin-top:12px">${linhas}</div>`}
  </div>`;
}

function statCard(cls,ico,lbl,val,foot,goto,badge){

  const hint = goto ? `<div class="gohint">Ver contas <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>` : `<div class="foot">${foot}</div>`;

/* badge de variação vs mês anterior (estilo PlannerFin) */
function badgeVar(atual,anterior,inverte){
  let pct;
  if(anterior===0 && atual===0) pct=0;
  else if(anterior===0) pct=100;
  else pct=(atual-anterior)/Math.abs(anterior)*100;
  const cls = pct===0 ? "flat" : ((pct>0)!==!!inverte ? "up" : "down");
  const sinal = pct>0?"+":"";
  return `<span class="badge ${cls}">${sinal}${pct.toFixed(1).replace(".",",")}%</span>`;
}

function viewTransacoes(){
  const mk=state.mes;
  let tx=txDoMes(mk);
  const rec=totalMes(mk,"receita"), desp=totalMes(mk,"despesa");
  const despPend=totalMes(mk,"despesa","pendente");
  const nRec=tx.filter(t=>t.tipo==="receita").length, nDesp=tx.filter(t=>t.tipo==="despesa").length;

  /* filtros */
  if(state.filtroTx==="receitas") tx=tx.filter(t=>t.tipo==="receita");
  else if(state.filtroTx==="despesas") tx=tx.filter(t=>t.tipo==="despesa");
  else if(state.filtroTx==="transferencias") tx=tx.filter(t=>t.tipo==="transferencia");
  else if(state.filtroTx==="pendentes") tx=tx.filter(t=>t.status==="pendente");
  if(state.txFixas) tx=tx.filter(t=>t.recorrente);
  const busca=(state.txBusca||"").toLowerCase();
  if(busca) tx=tx.filter(t=>
    (t.descricao||"").toLowerCase().includes(busca) ||
    catNome(t.categoriaId).toLowerCase().includes(busca) ||
    contaNome(t.contaId).toLowerCase().includes(busca));
  tx=tx.sort((a,b)=>b.data.localeCompare(a.data));

  /* paginação */
  const por=state.txPorPagina||10;
  const totalPag=Math.max(Math.ceil(tx.length/por),1);
  if(state.txPagina>totalPag) state.txPagina=totalPag;
  const ini=(state.txPagina-1)*por;
  const pagina=tx.slice(ini,ini+por);

  const linha=t=>{
    const isRec=t.tipo==="receita", isTr=t.tipo==="transferencia";
    const cat=getCat(t.categoriaId);
    const conta=getConta(t.contaId);
    return `<tr>
      <td class="num" style="white-space:nowrap">${dataBR(t.data)}</td>
      <td style="font-weight:700;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(t.descricao|| (isTr?"Transferência":catNome(t.categoriaId)))}</td>
      <td>${isTr?`<span class="cat-chip" style="background:var(--invest-soft);color:var(--invest)">⇄ ${escapeHtml(contaNome(t.contaId))} → ${escapeHtml(contaNome(t.contaDestinoId))}</span>`
        :(cat?`<span class="cat-chip" style="background:${cat.cor}1c;color:${cat.cor}">${cat.icone} ${escapeHtml(cat.nome)}</span>`:"—")}</td>
      <td>${conta?`<span style="display:inline-flex;align-items:center;gap:7px">${bancoBadge(conta,22)}<span style="font-size:12.5px;font-weight:600">${escapeHtml(conta.nome)}</span></span>`:"—"}</td>
      <td style="font-size:12.5px;font-weight:600;color:var(--ink-soft)">${t.cartaoId?escapeHtml(cartaoNome(t.cartaoId)):"-"}</td>
      <td class="t-right num" style="font-weight:800;color:${isTr?"var(--invest)":isRec?"var(--income)":"var(--expense)"}">${isRec?"+":isTr?"":"-"}${fmt(t.valor).replace("-","")}</td>
      <td>${t.status==="efetivado"?'<span class="pill pill-ok">Pago</span>':`<button class="pill pill-pend pill-click" data-efetivar="${t.id}" title="Clique para confirmar">Pendente</button>`}</td>
      <td class="num" style="white-space:nowrap;color:var(--ink-soft)">${t.status==="efetivado"?dataBR(t.data):"—"}</td>
      <td class="t-right"><div class="row-actions" style="justify-content:flex-end">
        <button class="icon-btn" data-edit-tx="${t.id}" title="Editar"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-btn danger" data-del-tx="${t.id}" title="Excluir"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div></td>
    </tr>`;
  };

  return `
  <div class="page-actions">
    <button class="btn btn-primary" id="btnNew2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova Transação</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <div class="stat"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="lbl">Saldo</div><div class="val num" style="margin-top:6px;color:${rec-desp>=0?"var(--income)":"var(--expense)"}">${fmt(rec-desp)}</div></div><div class="ico ic-expense" style="width:34px;height:34px">${iconCard()}</div></div></div>
    <div class="stat"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="lbl">Receitas</div><div class="val num" style="margin-top:6px;color:var(--income)">${fmt(rec)}</div><div class="foot">${nRec}</div></div><div class="ico ic-income" style="width:34px;height:34px">${iconUp()}</div></div></div>
    <div class="stat"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="lbl">Despesas</div><div class="val num" style="margin-top:6px;color:var(--expense)">${fmt(desp)}</div><div class="foot">${nDesp}</div></div><div class="ico ic-expense" style="width:34px;height:34px">${iconDown()}</div></div></div>
    <div class="stat"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="lbl">Despesas Pendentes</div><div class="val num" style="margin-top:6px;color:var(--goal)">${fmt(despPend)}</div></div><div class="ico ic-goal" style="width:34px;height:34px">${iconClock()}</div></div></div>
  </div>

  <div class="card card-pad" style="margin-top:16px">
    <div class="mchips" style="margin-bottom:12px">
      <span class="mchip-ano">
        <button data-mes-ano="-1" title="Ano anterior">‹</button>
        <span style="padding:0 4px">${state.mes.slice(0,4)}</span>
        <button data-mes-ano="1" title="Próximo ano">›</button>
      </span>
      ${MES_ABR.map((ab,i)=>{
        const mkChip=state.mes.slice(0,4)+"-"+String(i+1).padStart(2,"0");
        return `<button class="mchip ${mkChip===state.mes?"on":""}" data-mes-chip="${mkChip}">${ab}</button>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border-soft)">
      <select id="selTxFiltro" class="mini-sel">
        ${[["todos","Todas"],["receitas","Receitas"],["despesas","Despesas"],["transferencias","Transferências"],["pendentes","Pendentes"]].map(([v,n])=>`<option value="${v}" ${state.filtroTx===v?"selected":""}>${n}</option>`).join("")}
      </select>
      <label class="switch-row"><span class="switch ${state.txFixas?"on":""}" id="txFixasToggle"><i></i></span><span style="font-size:12px;font-weight:700">Contas Fixas</span></label>
      <div class="search-box"><svg viewBox="0 0 24 24" width="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="txBusca" placeholder="Buscar transações..." value="${escapeHtml(state.txBusca||"")}"></div>
      <div style="flex:1"></div>
      <button class="btn btn-ghost" id="btnExportTx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Exportar</button>
    </div>

    ${tx.length?`
    <div style="overflow-x:auto;margin-top:4px"><table class="tx-table">
      <thead><tr>
        <th>📅 Registro</th><th>📝 Descrição</th><th>🏷️ Categoria</th><th>🏦 Conta</th><th>💳 Cartão</th><th class="t-right">💰 Valor</th><th>✅ Status</th><th>📆 Pagamento</th><th></th>
      </tr></thead>
      <tbody>${pagina.map(linha).join("")}</tbody>
    </table></div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--ink-soft)">
      <span>Mostrar <select id="selTxPag" class="mini-sel" style="padding:4px 8px">${[10,25,50].map(n=>`<option ${por===n?"selected":""}>${n}</option>`).join("")}</select> por página</span>
      <span>Mostrando ${tx.length?ini+1:0}-${Math.min(ini+por,tx.length)} de ${tx.length} transações</span>
      <div style="flex:1"></div>
      ${totalPag>1?`<div style="display:flex;gap:6px">
        <button class="btn btn-ghost" data-tx-pag="-1" ${state.txPagina<=1?"disabled":""} style="padding:5px 10px">‹</button>
        <span style="align-self:center">Página ${state.txPagina} de ${totalPag}</span>
        <button class="btn btn-ghost" data-tx-pag="1" ${state.txPagina>=totalPag?"disabled":""} style="padding:5px 10px">›</button>
      </div>`:""}
    </div>`
    : emptyBig("Nenhuma transação aqui","Use o botão “Nova Transação” para registrar uma receita, despesa ou transferência.")}
  </div>`;
}


function txRow(t){
  if(t.tipo==="transferencia") return txRowTransfer(t);
  const isRec=t.tipo==="receita";
  return `<div class="tx-row">
    <div class="tx-ico" style="background:${catCor(t.categoriaId)}1f">${catIcone(t.categoriaId)}</div>
    <div class="tx-main">
      <div class="tx-desc">${escapeHtml(t.descricao||catNome(t.categoriaId))}</div>
      <div class="tx-meta"><span>${catNome(t.categoriaId)}</span><span>·</span><span>${contaNome(t.contaId)}</span>
        ${t.status==="pendente"?'<span class="pill pill-pend">Pendente</span>':'<span class="pill pill-ok">Efetivada</span>'}
        ${t.recorrente?'<span class="pill pill-rec">Fixa</span>':''}</div>
    </div>
    <div class="tx-val ${isRec?"pos":"neg"}">${isRec?"+":"−"}${fmt(t.valor).replace("R$ ","R$ ").replace("-","")}</div>
    <div class="row-actions">
      ${t.status==="pendente"?`<button class="icon-btn" data-efetivar="${t.id}" title="Marcar como efetivada"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>`:""}
      <button class="icon-btn" data-edit-tx="${t.id}" title="Editar"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn danger" data-del-tx="${t.id}" title="Excluir"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>

function iconTransfer(){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';}
function txRowTransfer(t){

      <div class="tx-desc">${escapeHtml(t.descricao||"Transferência")}</div>
      <div class="tx-meta"><span>${contaNome(t.contaId)} → ${contaNome(t.contaDestinoId)}</span>
