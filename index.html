      ${t.status==="pendente"?`<button class="icon-btn" data-efetivar="${t.id}" title="Marcar como efetivada"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>`:""}
      <button class="icon-btn" data-edit-tx="${t.id}" title="Editar"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn danger" data-del-tx="${t.id}" title="Excluir"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
    </div>
  </div>`;
}
function txRowMini(t){
  if(t.tipo==="transferencia"){
    return `<div class="tx-row">
      <div class="tx-ico" style="background:var(--invest-soft);color:var(--invest)">${iconTransfer()}</div>
      <div class="tx-main"><div class="tx-desc">${escapeHtml(t.descricao||"Transferência")}</div>
        <div class="tx-meta"><span>${dataBR(t.data)}</span><span>${contaNome(t.contaId)} → ${contaNome(t.contaDestinoId)}</span></div></div>

/* ---------------- FIXAS E RECORRENTES ---------------- */
function viewRecorrencias(){
  const recs=DB.recorrencias;
  const ativas=recs.filter(r=>r.ativa);
  const recMensal=ativas.filter(r=>r.tipo==="receita").reduce((a,r)=>a+equivMensal(r),0);
  const despMensal=ativas.filter(r=>r.tipo==="despesa").reduce((a,r)=>a+equivMensal(r),0);
  const receitas=recs.filter(r=>r.tipo==="receita");
  const despesas=recs.filter(r=>r.tipo==="despesa");
  const ordena=arr=>arr.slice().sort((x,y)=>(Number(y.ativa)-Number(x.ativa)) || (x.descricao||"").localeCompare(y.descricao||""));
  return `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    ${statCard("ic-income",iconUp(),"Receitas fixas / mês",fmt(recMensal),`${receitas.filter(r=>r.ativa).length} ativa(s)`)}
    ${statCard("ic-expense",iconDown(),"Despesas fixas / mês",fmt(despMensal),`${despesas.filter(r=>r.ativa).length} ativa(s)`)}
    ${statCard(recMensal-despMensal>=0?"ic-income":"ic-expense",iconBalance(),"Saldo fixo / mês",fmt(recMensal-despMensal),recMensal-despMensal>=0?"sobra estimada":"déficit estimado")}
  </div>

  <div class="card card-pad" style="margin-top:16px">
    <div class="card-head" style="flex-wrap:wrap;gap:12px">
      <div><h3>Lançamentos fixos</h3><span class="sub">cadastre uma vez — agendamos cada período automaticamente</span></div>
      <button class="btn btn-primary" id="btnNewRec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova recorrência</button>
    </div>
    ${recs.length? `
      <div style="font-size:11px;font-weight:700;color:var(--income);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 2px">Receitas fixas</div>
      ${receitas.length? ordena(receitas).map(recRow).join("") : `<div style="font-size:12.5px;color:var(--ink-faint);font-weight:600;padding:8px 4px">Nenhuma receita fixa cadastrada.</div>`}
      <div style="font-size:11px;font-weight:700;color:var(--expense);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 2px">Despesas fixas</div>
      ${despesas.length? ordena(despesas).map(recRow).join("") : `<div style="font-size:12.5px;color:var(--ink-faint);font-weight:600;padding:8px 4px">Nenhuma despesa fixa cadastrada.</div>`}
    ` : emptyBig("Nenhum lançamento fixo ainda","Cadastre aluguel, salário, assinaturas e tudo que se repete. Eles entram no fluxo de caixa e nos próximos lançamentos automaticamente.")}
  </div>

  ${ativas.some(r=>r.lancarStatus!=="efetivado")?`<div style="font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:12px;display:flex;gap:9px;align-items:flex-start;padding:0 4px">
    <span style="font-size:15px">💡</span><span>Os lançamentos fixos entram como <b>agendados</b> no fluxo de caixa. Confirme cada um com o ✓ na tela de <b>Transações</b> quando pagar/receber, para que entre no saldo das contas.</span></div>`:""}
  `;
}
function recRow(r){
  const isRec=r.tipo==="receita";
  const prox=proximaOcorrencia(r);
  const freqNome=(FREQS[r.frequencia]&&FREQS[r.frequencia].nome)||r.frequencia;
  const edSvg='<svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const delSvg='<svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
  const pauseSvg='<svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  const playSvg='<svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>';
  return `<div class="tx-row" style="${r.ativa?"":"opacity:.55"}">
    <div class="tx-ico" style="background:${catCor(r.categoriaId)}1f">${catIcone(r.categoriaId)}</div>
    <div class="tx-main">
      <div class="tx-desc">${escapeHtml(r.descricao||catNome(r.categoriaId))}</div>
      <div class="tx-meta">
        <span>${catNome(r.categoriaId)}</span><span>·</span><span>${contaNome(r.contaId)}</span>
        <span class="pill pill-rec">${freqNome}</span>
        ${r.ativa? (prox?`<span>próx. ${dataBR(prox)}</span>`:`<span>encerrada</span>`) : `<span class="pill pill-pend">Pausada</span>`}
        ${r.dataFim?`<span>até ${dataBR(r.dataFim)}</span>`:""}
      </div>
    </div>
    <div class="tx-val ${isRec?"pos":"neg"}">${isRec?"+":"−"}${fmt(r.valor).replace("-","")}</div>
    <div class="row-actions" style="opacity:1">
      <button class="icon-btn" data-toggle-rec="${r.id}" title="${r.ativa?"Pausar":"Reativar"}">${r.ativa?pauseSvg:playSvg}</button>
      <button class="icon-btn" data-edit-rec="${r.id}" title="Editar">${edSvg}</button>
      <button class="icon-btn danger" data-del-rec="${r.id}" title="Excluir">${delSvg}</button>
    </div>
  </div>`;
}

/* ---------------- CONTAS ---------------- */
function viewContas(){
  const contas=DB.contas.filter(c=>!c.arquivada);
  const nCon=contas.filter(c=>c.consolidar!==false).length;
  const nFora=contas.length-nCon;
  const sub= nFora>0
    ? `soma de ${nCon} de ${contas.length} conta(s) ativa(s) · ${nFora} fora do consolidado`
    : "soma de todas as contas ativas";
  const mk=state.mes;
  const prevConsol=saldoTotalPrevisto(mk);
  const labelMes=nomeMes(mk).toLowerCase();
  return `
  <div class="card card-pad">
    <div class="card-head"><h3>Saldo consolidado</h3>
      <button class="btn btn-primary" id="btnNewConta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova conta</button></div>
    <div style="display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end;margin-top:4px">
      <div>
        <div style="font-size:34px;font-weight:800;letter-spacing:-1px" class="num ${saldoTotal()>=0?"":"neg"}">${fmt(saldoTotal())}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:2px">saldo atual</div>
      </div>
      <div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--invest)" class="num">${fmt(prevConsol)}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:2px">previsto no fim de ${labelMes}</div>
      </div>
    </div>
    <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:10px">${sub}</div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:16px">
    ${contas.length? contas.map(c=>{
      const s=saldoConta(c.id);
      const prev=saldoContaPrevisto(c.id,mk);
      const fora=c.consolidar===false;
      const banco=getBanco(c.banco);
      const subt= banco? banco.nome : escapeHtml(c.tipo);
      return `<div class="card card-pad" style="${fora?"border-color:var(--border);background:var(--surface-2)":""}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:11px;min-width:0">
            ${bancoBadge(c,40)}

/* ---------------- INVESTIMENTOS ---------------- */
function viewInvestimentos(){
  const inv=DB.investimentos;
  const aplicado=inv.reduce((a,i)=>a+(i.valorAplicado||0),0);
  const atual=inv.reduce((a,i)=>a+(i.valorAtual||0),0);
  const rend=atual-aplicado;
  const pct= aplicado>0? (rend/aplicado*100):0;
  return `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    ${statCard("ic-invest",iconChart(),"Patrimônio investido",fmt(atual),`${inv.length} aplicação(ões)`)}
    ${statCard("ic-brand",iconWallet(),"Total aplicado",fmt(aplicado),"valor investido")}
    ${statCard(rend>=0?"ic-income":"ic-expense",iconUp(),"Rentabilidade",fmt(rend),`${pct>=0?"+":""}${pct.toFixed(2).replace(".",",")}%`)}
  </div>
  <div class="card card-pad" style="margin-top:16px">
    <div class="card-head"><h3>Minha carteira</h3>
      <button class="btn btn-primary" id="btnNewInv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo investimento</button></div>
    ${inv.length?`
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Investimento</th><th>Tipo</th><th class="t-right">Aplicado</th><th class="t-right">Atual</th><th class="t-right">Rendimento</th><th></th></tr></thead>
      <tbody>${inv.map(i=>{
        const r=(i.valorAtual||0)-(i.valorAplicado||0);
        const p= i.valorAplicado>0? r/i.valorAplicado*100:0;
        return `<tr>
          <td style="font-weight:700">${escapeHtml(i.nome)}${i.instituicao?`<div style="font-size:11px;color:var(--ink-soft);font-weight:500">${escapeHtml(i.instituicao)}</div>`:""}</td>
          <td>${escapeHtml(i.tipo||"—")}</td>
          <td class="t-right num">${fmt(i.valorAplicado||0)}</td>
          <td class="t-right num" style="font-weight:700">${fmt(i.valorAtual||0)}</td>
          <td class="t-right num ${r>=0?"pos":"neg"}" style="font-weight:700">${r>=0?"+":""}${fmt(r).replace("-","")}<div style="font-size:11px">${p>=0?"+":""}${p.toFixed(1).replace(".",",")}%</div></td>
          <td class="t-right"><div style="display:flex;gap:4px;justify-content:flex-end">
            <button class="icon-btn" data-edit-inv="${i.id}"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
            <button class="icon-btn danger" data-del-inv="${i.id}"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
          </div></td>
        </tr>`;}).join("")}</tbody>
    </table></div>`
    : emptyBig("Carteira vazia","Cadastre seus investimentos para acompanhar a rentabilidade.")}
  </div>`;
}

/* ---------------- ORÇAMENTOS (matriz categorias x meses, estilo PlannerFin) ---------------- */
function viewOrcamento(){
  const ano=state.ano;
  const meses=[]; for(let m=1;m<=12;m++) meses.push(`${ano}-${String(m).padStart(2,"0")}`);
  const incl=!!state.orcPend;
  const catsR=DB.categorias.filter(c=>c.tipo==="receita");
  const catsD=DB.categorias.filter(c=>c.tipo==="despesa");
  const mkAtual=mesAtual();

  const sub=`<th class="orc-sub">🎯 Planejado</th><th class="orc-sub">✓ Realizado</th><th class="orc-sub">△ Diferença</th><th class="orc-sub">📈 Atingimento</th><th class="orc-sub">% Receita</th>`;

  const celCat=(c,mk,tipo)=>{
    const plan=planejadoCat(c.id,mk);
    const real=somaCatMes(c.id,mk,tipo,incl);
    const recMes=catsR.reduce((a,cr)=>a+somaCatMes(cr.id,mk,"receita",incl),0);
    const dif= tipo==="despesa"? plan-real : real-plan;
    const ating= plan>0? real/plan*100 : 0;
    const pctRec= recMes>0? real/recMes*100 : 0;
    const corDif= dif===0? "var(--ink-faint)" : (dif>0? "var(--income)":"var(--expense)");
    const atual=mk===mkAtual?" orc-atual":"";
    return `<td class="orc-cel orc-edit${atual}" data-orc="${c.id}|${mk}" title="Clique para definir o planejado"><span class="num">${fmt(plan)}</span></td>
      <td class="orc-cel${atual}"><span class="num" style="${real>0?"font-weight:700":""}">${fmt(real)}</span></td>
      <td class="orc-cel${atual}"><span class="num" style="color:${corDif};font-weight:700">${plan||real?fmt(dif):"—"}</span></td>
      <td class="orc-cel${atual}"><span class="num" style="color:${ating>100?"var(--expense)":"var(--income)"}">${ating.toFixed(2).replace(".",",")}%</span></td>
      <td class="orc-cel orc-fim${atual}"><span class="num" style="color:var(--ink-faint)">${pctRec.toFixed(2).replace(".",",")}%</span></td>`;
  };
  const linhaCat=(c,tipo)=>`<tr class="orc-linha-cat">
    <td class="orc-fixa"><span style="display:inline-flex;align-items:center;gap:7px;padding-left:14px"><span>${c.icone}</span><span style="font-weight:600;font-size:12px">${escapeHtml(c.nome)}</span></span></td>
    ${meses.map(mk=>celCat(c,mk,tipo)).join("")}
  </tr>`;
  const linhaGrupo=(nome,cats,tipo,cor)=>{
    const cel=mk=>{
      const plan=cats.reduce((a,c)=>a+planejadoCat(c.id,mk),0);
      const real=cats.reduce((a,c)=>a+somaCatMes(c.id,mk,tipo,incl),0);
      const dif= tipo==="despesa"? plan-real : real-plan;
      const ating= plan>0? real/plan*100:0;
      const atual=mk===mkAtual?" orc-atual":"";
      return `<td class="orc-cel orc-grp${atual}" style="background:${cor}"><b class="num">${fmt(plan)}</b></td>
        <td class="orc-cel orc-grp${atual}" style="background:${cor}"><b class="num">${fmt(real)}</b></td>
        <td class="orc-cel orc-grp${atual}" style="background:${cor}"><b class="num" style="color:${dif>=0?"var(--income)":"var(--expense)"}">${plan||real?fmt(dif):"—"}</b></td>
        <td class="orc-cel orc-grp${atual}" style="background:${cor}"><b class="num">${ating.toFixed(2).replace(".",",")}%</b></td>
        <td class="orc-cel orc-grp orc-fim${atual}" style="background:${cor}"><b class="num">—</b></td>`;
    };
    return `<tr class="orc-linha-grp">
      <td class="orc-fixa" style="background:${cor}"><b style="font-size:12px">${nome}</b></td>
      ${meses.map(cel).join("")}
    </tr>`;
  };
  const linhaTotalDesp=()=>{
    const cel=mk=>{
      const plan=catsD.reduce((a,c)=>a+planejadoCat(c.id,mk),0);
      const real=catsD.reduce((a,c)=>a+somaCatMes(c.id,mk,"despesa",incl),0);
      const dif=plan-real;
      const ating= plan>0? real/plan*100:0;
      return `<td class="orc-cel orc-total"><b class="num">${fmt(plan)}</b></td>
        <td class="orc-cel orc-total"><b class="num">${fmt(real)}</b></td>
        <td class="orc-cel orc-total"><b class="num" style="color:${dif>=0?"#4ADE80":"#FCA5A5"}">${fmt(dif)}</b></td>
        <td class="orc-cel orc-total"><b class="num">${ating.toFixed(2).replace(".",",")}%</b></td>
        <td class="orc-cel orc-total orc-fim"><b class="num">—</b></td>`;
    };
    return `<tr class="orc-linha-total"><td class="orc-fixa orc-total-fixa"><b style="font-size:12px">📊 Total Despesas</b></td>${meses.map(cel).join("")}</tr>`;
  };
  const linhaSobra=()=>{
    const cel=mk=>{
      const rec=catsR.reduce((a,c)=>a+somaCatMes(c.id,mk,"receita",incl),0);
      const desp=catsD.reduce((a,c)=>a+somaCatMes(c.id,mk,"despesa",incl),0);
      const planR=catsR.reduce((a,c)=>a+planejadoCat(c.id,mk),0);
      const planD=catsD.reduce((a,c)=>a+planejadoCat(c.id,mk),0);
      const sobra=rec-desp, sobraPlan=planR-planD;
      return `<td class="orc-cel orc-sobra"><b class="num" style="color:${sobraPlan>=0?"#4ADE80":"#FCA5A5"}">${fmt(sobraPlan)}</b></td>
        <td class="orc-cel orc-sobra"><b class="num" style="color:${sobra>=0?"#4ADE80":"#FCA5A5"}">${fmt(sobra)}</b></td>
        <td class="orc-cel orc-sobra"><b class="num" style="color:var(--ink-faint)">—</b></td>
        <td class="orc-cel orc-sobra"><b class="num" style="color:var(--ink-faint)">—</b></td>
        <td class="orc-cel orc-sobra orc-fim"><b class="num" style="color:var(--ink-faint)">—</b></td>`;
    };
    return `<tr class="orc-linha-sobra"><td class="orc-fixa orc-sobra-fixa"><b style="font-size:12px">💰 Sobra Mensal</b></td>${meses.map(cel).join("")}</tr>`;
  };

  return `
  <div class="page-actions" style="gap:10px">
    <div class="mchip-ano" style="font-size:13px">
      <button data-orc-ano="-1" title="Ano anterior">‹</button><span style="padding:0 8px;font-weight:800">${ano}</span><button data-orc-ano="1" title="Próximo ano">›</button>
    </div>
    <label class="switch-row"><span class="switch ${incl?"on":""}" id="orcPendToggle"><i></i></span><span style="font-size:12px;font-weight:700">Incluir pendentes</span></label>
    <button class="btn btn-ghost" id="btnOrc">🎯 Limites padrão</button>
  </div>
  <div class="card" style="overflow:hidden">
    <div class="orc-wrap">
      <table class="orc-table">
        <thead>
          <tr><th class="orc-fixa orc-head-cat">Categoria</th>${meses.map(mk=>`<th colspan="5" class="orc-mes ${mk===mkAtual?"orc-mes-atual":""}">${MES_ABR[Number(mk.slice(5,7))-1]}</th>`).join("")}</tr>
          <tr><th class="orc-fixa"></th>${meses.map(()=>sub).join("")}</tr>
        </thead>
        <tbody>
          ${linhaGrupo("▾ 💵 Receitas",catsR,"receita","var(--income-soft)")}
          ${catsR.map(c=>linhaCat(c,"receita")).join("")}
          ${linhaGrupo("▾ 💸 Despesas",catsD,"despesa","var(--expense-soft)")}
          ${catsD.map(c=>linhaCat(c,"despesa")).join("")}
          ${linhaTotalDesp()}
          ${linhaSobra()}
        </tbody>
      </table>
    </div>
    <div style="padding:10px 16px;font-size:11.5px;color:var(--ink-faint);font-weight:600;border-top:1px solid var(--border-soft)">Clique numa célula de <b>Planejado</b> para definir o valor daquele mês. Sem valor definido, vale o limite padrão da categoria.</div>
  </div>`;
}

/* ---------------- DÍVIDAS (estilo PlannerFin) ---------------- */
function viewDividas(){
  const ds=DB.dividas||[];
  const h=hoje();
  const total=totalDividas(), aberto=totalDividasAberto();
  const vencidas=ds.filter(d=>dividaAberto(d)>0 && d.vencimento && d.vencimento<h).length;
  const pgtoMensal=ds.filter(d=>d.modo==="parcelado" && dividaAberto(d)>0).reduce((a,d)=>a+(+d.valorParcela||0),0);

  let lista=ds.slice();
  const busca=(state.divBusca||"").toLowerCase();
  if(busca) lista=lista.filter(d=>(d.nome||"").toLowerCase().includes(busca)||(d.credor||"").toLowerCase().includes(busca));
  if(state.divStatus==="abertas") lista=lista.filter(d=>dividaAberto(d)>0);
  else if(state.divStatus==="quitadas") lista=lista.filter(d=>dividaAberto(d)<=0);
  lista.sort((a,b)=>dividaAberto(b)-dividaAberto(a));

  const cardDivida=d=>{
    const ab=dividaAberto(d), quit=ab<=0;
    const p= d.valorTotal>0? Math.min((d.valorPago||0)/d.valorTotal*100,100):0;
    const q=dividaQuitacao(d);
    return `<div class="card card-pad">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div style="display:flex;align-items:center;gap:11px;min-width:0">
          <div style="width:42px;height:42px;border-radius:11px;background:${d.cor}22;display:grid;place-items:center;font-size:19px;flex-shrink:0">${d.icone||"💳"}</div>
          <div style="min-width:0"><div style="font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(d.nome)}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
              ${quit?'<span class="pill pill-ok">Quitada</span>':`<span class="pill" style="background:var(--expense-soft);color:var(--expense)">Em aberto</span>`}
              <span>${dividaModoLabel(d)}</span>${d.credor?`<span>· ${escapeHtml(d.credor)}</span>`:""}
            </div></div>
        </div>
        <div class="row-actions" style="opacity:1">
          ${!quit?`<button class="icon-btn" data-pay-divida="${d.id}" title="Registrar pagamento"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>`:""}
          ${q?`<button class="icon-btn" data-quit-divida="${d.id}" title="Quitar à vista"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></button>`:""}
          <button class="icon-btn" data-edit-divida="${d.id}" title="Editar"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-btn danger" data-del-divida="${d.id}" title="Excluir"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
        </div>
      </div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-top:14px">
        <div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700">Restante</div><div class="num ${quit?"pos":"neg"}" style="font-size:19px;font-weight:800">${quit?"R$ 0,00":fmt(ab)}</div></div>
        <div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700">Total</div><div class="num" style="font-size:19px;font-weight:800">${fmt(d.valorTotal||0)}</div></div>
        ${d.vencimento?`<div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700">Vencimento</div><div class="num" style="font-size:14px;font-weight:700;margin-top:3px;color:${!quit&&d.vencimento<h?"var(--expense)":"var(--ink)"}">${dataBR(d.vencimento)}${!quit&&d.vencimento<h?" ⚠️":""}</div></div>`:""}
      </div>
      ${dividaDetalhe(d)?`<div style="font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:8px">${dividaDetalhe(d)}</div>`:""}
      <div class="bar" style="margin-top:10px;height:8px"><i style="width:${p}%;background:${quit?"var(--income)":"var(--brand)"}"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:700;color:var(--ink-soft)"><span>${p.toFixed(0)}% pago</span><span>${fmt(Math.min(d.valorPago||0,d.valorTotal||0))} de ${fmt(d.valorTotal||0)}</span></div>
      ${q?`<div style="font-size:11px;font-weight:700;color:var(--income);margin-top:8px">💡 Quitação à vista: ${fmt(q.valor)} (economia de ${fmt(q.economia)})</div>`:""}
    </div>`;
  };

  return `
  <div class="page-actions">
    <button class="btn btn-dark" id="btnNewDivida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova Dívida</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
    <div class="stat"><div style="display:flex;justify-content:space-between"><div><div class="lbl">Total em Dívidas</div><div class="val num" style="margin-top:6px;color:var(--expense)">${fmt(total)}</div><div class="foot">Valor total devido</div></div><div class="ico ic-expense" style="width:34px;height:34px">${iconCard()}</div></div></div>
    <div class="stat"><div style="display:flex;justify-content:space-between"><div><div class="lbl">Restante a Pagar</div><div class="val num" style="margin-top:6px;color:var(--expense)">${fmt(aberto)}</div><div class="foot">Ainda precisa ser pago</div></div><div class="ico ic-expense" style="width:34px;height:34px">${iconDown()}</div></div></div>
    <div class="stat"><div style="display:flex;justify-content:space-between"><div><div class="lbl">Dívidas Vencidas</div><div class="val num" style="margin-top:6px;color:var(--expense)">${vencidas}</div><div class="foot">Precisam de atenção</div></div><div class="ico ic-goal" style="width:34px;height:34px">${iconAlert()}</div></div></div>
    <div class="stat"><div style="display:flex;justify-content:space-between"><div><div class="lbl">Pagamentos Mensais</div><div class="val num" style="margin-top:6px;color:var(--expense)">${fmt(pgtoMensal)}</div><div class="foot">Estimativa mensal</div></div><div class="ico ic-brand" style="width:34px;height:34px">${iconCalendar()}</div></div></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
    <div class="search-box" style="flex:1;min-width:220px"><svg viewBox="0 0 24 24" width="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="divBusca" placeholder="Pesquisar dívidas..." value="${escapeHtml(state.divBusca||"")}"></div>
    <select id="selDivStatus" class="mini-sel">${[["todas","Todos os status"],["abertas","Em aberto"],["quitadas","Quitadas"]].map(([v,n])=>`<option value="${v}" ${state.divStatus===v?"selected":""}>${n}</option>`).join("")}</select>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin-top:16px">
    ${lista.length? lista.map(cardDivida).join("")
    : `<div class="empty" style="grid-column:1/-1;padding:48px 20px">${iconInbox()}<p>${ds.length?"Nenhuma dívida com este filtro":"Você ainda não tem dívidas cadastradas."}</p>
       ${!ds.length?'<button class="btn btn-ghost" id="btnPrimeiraDivida" style="margin-top:12px">+ Adicionar primeira dívida</button>':""}</div>`}
  </div>`;
}

/* ---------------- METAS / Vision Board (estilo PlannerFin) ---------------- */
function viewObjetivos(){
  let objs=(DB.objetivos||[]).slice();
  const busca=(state.metaBusca||"").toLowerCase();
  if(busca) objs=objs.filter(o=>(o.nome||"").toLowerCase().includes(busca));
  if(state.metaFiltro==="concluidas") objs=objs.filter(o=>o.valorAlvo>0 && o.valorAtual>=o.valorAlvo);
  else if(state.metaFiltro==="andamento") objs=objs.filter(o=>!(o.valorAlvo>0 && o.valorAtual>=o.valorAlvo));

  const cardMeta=o=>{

/* ---------------- PREVISÃO DE SALDO ---------------- */
function ultimoDiaMesStr(mk){ return `${mk}-${String(diasNoMes(mk)).padStart(2,"0")}`; }
function prevAggMes(mk){
  const ids=new Set(contasConsolidadas().map(c=>c.id));
  const tt=DB.transacoes.filter(t=>t.data.slice(0,7)===mk && (ids.has(t.contaId)||(t.tipo==="transferencia"&&ids.has(t.contaDestinoId))));
  const soma=(tipo,st)=>tt.filter(t=>t.tipo===tipo&&t.status===st).reduce((a,t)=>a+t.valor,0);
  const sims=simsDoMes(mk);
  const recP=soma("receita","efetivado"), recPd=soma("receita","pendente");
  const despP=soma("despesa","efetivado"), despPd=soma("despesa","pendente");
  const fluxo=(recP+recPd+sims.rec)-(despP+despPd+sims.desp);
  const fim=ultimoDiaMesStr(mk);
  const saldoProj=saldoFluxoAte(fim)+simsAcumAte(fim);
  return {recP,recPd,despP,despPd,simRec:sims.rec,simDesp:sims.desp,fluxo,saldoProj};
}
function viewPrevisao(){
  const ano=state.prevAno||Number(hoje().slice(0,4));
  state.prevAno=ano;
  const mkAtual=mesAtual();
  const meses=[]; for(let m=1;m<=12;m++) meses.push(`${ano}-${String(m).padStart(2,"0")}`);
  const aggs=meses.map(mk=>({mk,...prevAggMes(mk)}));

  const saldoAtual=saldoTotal();
  const projDez=aggs[11].saldoProj;
  let menor=aggs[0], recAno=0, despAno=0, maisCaro=aggs[0];
  aggs.forEach(a=>{
    if(a.saldoProj<menor.saldoProj) menor=a;
    recAno+=a.recP+a.recPd+a.simRec; despAno+=a.despP+a.despPd+a.simDesp;
    if((a.despP+a.despPd)>(maisCaro.despP+maisCaro.despPd)) maisCaro=a;
  });
  const economia=recAno-despAno;

  const celMes=a=>{
    const aberto=state.prevAberto===a.mk;
    const atual=a.mk===mkAtual;
    let diarias="";
    if(aberto){
      const n=diasNoMes(a.mk);
      const ids=new Set(contasConsolidadas().map(c=>c.id));
      const semana=["dom","seg","ter","qua","qui","sex","sáb"];
      for(let d=1;d<=n;d++){
        const dia=`${a.mk}-${String(d).padStart(2,"0")}`;
        const td=DB.transacoes.filter(t=>t.data===dia && (ids.has(t.contaId)||(t.tipo==="transferencia"&&ids.has(t.contaDestinoId))));
        const s=(tipo,st)=>td.filter(t=>t.tipo===tipo&&t.status===st).reduce((x,t)=>x+t.valor,0);
        const sim=simDe(dia);
        const recP=s("receita","efetivado"),recPd=s("receita","pendente"),despP=s("despesa","efetivado"),despPd=s("despesa","pendente");
        const fluxo=(recP+recPd+sim.rec)-(despP+despPd+sim.desp);
        const sp=saldoFluxoAte(dia)+simsAcumAte(dia);
        const dw=new Date(dia+"T12:00:00").getDay();
        diarias+=`<tr class="prev-dia">
          <td class="prev-fixa" style="padding-left:26px"><span class="num" style="font-weight:700">${d}</span> <span style="font-size:10px;color:${dw===0||dw===6?"var(--expense)":"var(--ink-faint)"};font-weight:700">${semana[dw]}</span></td>
          <td class="t-right num" style="color:var(--income)">${fmt(recP)}</td>
          <td class="t-right num" style="color:var(--income);opacity:.7">${fmt(recPd)}</td>
          <td class="t-right num" style="color:var(--expense)">${fmt(despP)}</td>
          <td class="t-right num" style="color:var(--expense);opacity:.7">${fmt(despPd)}</td>
          <td class="t-right num prev-sim" data-sim="${dia}|rec" title="Clique para simular uma receita">${sim.rec?fmt(sim.rec):"–"}</td>
          <td class="t-right num prev-sim" data-sim="${dia}|desp" title="Clique para simular uma despesa">${sim.desp?fmt(sim.desp):"–"}</td>
          <td class="t-right num" style="font-weight:700;color:${fluxo>=0?"var(--income)":"var(--expense)"}">${fmt(fluxo)}</td>
          <td class="t-right num" style="font-weight:800;color:${sp>=0?"var(--income)":"var(--expense)"}">${fmt(sp)}</td>
          <td class="t-right num" style="color:var(--ink-faint);font-size:11px">${dataBR(dia)}</td>
        </tr>`;
      }
    }
    return `<tr class="prev-mes ${atual?"prev-mes-atual":""}" data-prev-toggle="${a.mk}" style="cursor:pointer">
      <td class="prev-fixa"><span style="display:inline-flex;align-items:center;gap:7px"><span style="font-size:10px;color:var(--ink-faint)">${aberto?"▾":"▸"}</span><b style="font-size:12.5px">${MESES[Number(a.mk.slice(5,7))-1]}</b>${atual?'<span class="pill" style="background:var(--brand);color:#fff">Atual</span>':""}</span></td>
      <td class="t-right num" style="font-weight:700;color:var(--income)">${fmt(a.recP)}</td>
      <td class="t-right num" style="color:var(--income);opacity:.75">${fmt(a.recPd)}</td>
      <td class="t-right num" style="font-weight:700;color:var(--expense)">${fmt(a.despP)}</td>
      <td class="t-right num" style="color:var(--expense);opacity:.75">${fmt(a.despPd)}</td>
      <td class="t-right num" style="color:var(--invest)">${a.simRec?fmt(a.simRec):"–"}</td>
      <td class="t-right num" style="color:var(--invest)">${a.simDesp?fmt(a.simDesp):"–"}</td>
      <td class="t-right num" style="font-weight:800;color:${a.fluxo>=0?"var(--income)":"var(--expense)"}">${fmt(a.fluxo)}</td>
      <td class="t-right num" style="font-weight:800">${fmt(a.saldoProj)}</td>
      <td></td>
    </tr>${diarias}`;
  };

  return `
  <div class="page-actions" style="gap:10px">
    <div class="mchip-ano" style="font-size:13px"><button data-prev-ano="-1">‹</button><span style="padding:0 8px;font-weight:800">${ano}</span><button data-prev-ano="1">›</button></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div class="stat"><div class="top"><div class="ico ic-income" style="width:30px;height:30px">${iconDollar()}</div><div class="lbl">Saldo Atual</div></div><div class="val num" style="color:var(--income)">${fmt(saldoAtual)}</div></div>
    <div class="stat"><div class="top"><div class="ico ic-brand" style="width:30px;height:30px">${iconChart()}</div><div class="lbl">Projeção Dez/${ano}</div></div><div class="val num" style="color:var(--brand)">${fmt(projDez)}</div></div>
    <div class="stat"><div class="top"><div class="ico ic-goal" style="width:30px;height:30px">${iconDown()}</div><div class="lbl">Menor Saldo Previsto</div></div><div class="val num" style="color:var(--goal)">${fmt(menor.saldoProj)}</div><div class="foot">em ${nomeMes(menor.mk)}</div></div>
    <div class="stat"><div class="top"><div class="ico ${economia>=0?"ic-income":"ic-expense"}" style="width:30px;height:30px">${iconDollar()}</div><div class="lbl">Economia Anual</div></div><div class="val num" style="color:${economia>=0?"var(--income)":"var(--expense)"}">${fmt(economia)}</div><div class="foot">Mês mais caro: ${MES_ABR[Number(maisCaro.mk.slice(5,7))-1]} (${fmt(maisCaro.despP+maisCaro.despPd)})</div></div>
  </div>

  <div class="card" style="margin-top:16px;overflow:hidden">
    <div class="card-head" style="padding:16px 18px 0;margin-bottom:10px"><h3>📈 Previsão de Saldo Diário — ${ano}</h3>
      <span class="sub num">Saldo atual: <b style="color:var(--income)">${fmt(saldoAtual)}</b> &nbsp; Projeção Dez: <b style="color:var(--invest)">${fmt(projDez)}</b></span></div>
    <div class="orc-wrap"><table class="prev-table">
      <thead><tr>
        <th class="prev-fixa">📅 Mês / Dia</th>
        <th class="t-right">📗 Receitas Pagas</th><th class="t-right">📒 Receitas Penden.</th>
        <th class="t-right">📕 Despesas Pagas</th><th class="t-right">📙 Despesas Penden.</th>
        <th class="t-right">🧮 Simulação Receita</th><th class="t-right">🧮 Simulação Despesa</th>
        <th class="t-right">💧 Fluxo Líquido</th><th class="t-right">💰 Saldo Projetado</th><th class="t-right">📆 Data</th>

function drawPrevisaoChart(){

/* ---------------- MODAL: CARTÃO DE CRÉDITO ---------------- */
function modalCartao(edit){
  const c=edit||{nome:"",banco:"",limite:0,fechaDia:"",venceDia:""};
  openModal(`${modalHead(edit?"Editar cartão":"Novo cartão")}
  <div class="modal-body">
    <div class="field"><label>Nome do cartão</label><input id="ccNome" placeholder="Ex.: Nubank Cartão" value="${escapeHtml(c.nome)}"></div>
    <div class="field"><label>Instituição (opcional)</label><select id="ccBanco"><option value="">— sem instituição —</option>${BANCOS.filter(b=>b.grp==="banco").map(b=>`<option value="${b.id}" ${b.id===c.banco?"selected":""}>${escapeHtml(b.nome)}</option>`).join("")}</select></div>
    <div class="field"><label>Limite</label><input id="ccLimite" inputmode="decimal" placeholder="0,00" value="${c.limite?String(c.limite).replace(".",","):""}"></div>
    <div class="field"><div class="row2">
      <div><label>Fecha dia</label><input id="ccFecha" inputmode="numeric" placeholder="Ex.: 5" value="${c.fechaDia||""}"></div>
      <div><label>Vence dia</label><input id="ccVence" inputmode="numeric" placeholder="Ex.: 12" value="${c.venceDia||""}"></div>
    </div></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="ccSave">Salvar</button>
    </div>
  </div>`);
  document.getElementById("ccSave").onclick=()=>{
    const nome=document.getElementById("ccNome").value.trim();
    if(!nome){ toast("Dê um nome ao cartão.","err"); return; }
    const campos={ nome, banco:document.getElementById("ccBanco").value||"",
      limite:parseValor(document.getElementById("ccLimite").value),
      fechaDia:parseInt(document.getElementById("ccFecha").value)||"",
      venceDia:parseInt(document.getElementById("ccVence").value)||"" };
    DB.cartoes ||= [];
    if(edit){ const i=DB.cartoes.findIndex(x=>x.id===c.id); DB.cartoes[i]={...c,...campos}; }
    else DB.cartoes.push({id:uid(),...campos});
    salvar(); closeModal(); render(); toast(edit?"Cartão atualizado.":"Cartão adicionado.");
  };
}

  document.getElementById("btnPrimeiraMeta")?.addEventListener("click",()=>modalObjetivo());

  /* família */
  document.getElementById("btnFamilia")?.addEventListener("click",()=>toast("O compartilhamento em família ainda não está disponível nesta versão. Use o mesmo e-mail em vários aparelhos.","err"));

  /* cadastro */
  document.querySelectorAll("[data-cad-tab]").forEach(b=>b.onclick=()=>{ state.cadTab=b.dataset.cadTab; render(); });
  document.querySelectorAll("[data-cad-go]").forEach(b=>b.onclick=()=>{ state.cadTab=b.dataset.cadGo; render(); });
  ["btnNewCartao","btnNewCartao2"].forEach(id=>document.getElementById(id)?.addEventListener("click",()=>modalCartao()));
  document.querySelectorAll("[data-edit-cartao]").forEach(b=>b.onclick=()=>modalCartao(getCartao(b.dataset.editCartao)));
  document.querySelectorAll("[data-del-cartao]").forEach(b=>b.onclick=()=>{
    if(!confirm("Excluir este cartão? Os lançamentos associados serão mantidos, mas sem cartão.")) return;
    DB.cartoes=(DB.cartoes||[]).filter(c=>c.id!==b.dataset.delCartao);
    DB.transacoes.forEach(t=>{ if(t.cartaoId===b.dataset.delCartao) t.cartaoId=null; });
    salvar(); render(); toast("Cartão excluído.");
  });
  ["btnCats","btnCats2"].forEach(id=>document.getElementById(id)?.addEventListener("click",()=>modalCategorias()));

  /* previsão */
  document.querySelectorAll("[data-prev-ano]").forEach(b=>b.onclick=()=>{ state.prevAno+=Number(b.dataset.prevAno); render(); });
  document.querySelectorAll("[data-prev-toggle]").forEach(tr=>tr.onclick=e=>{
    if(e.target.closest("[data-sim]")) return;
    const mk=tr.dataset.prevToggle;
    state.prevAberto = state.prevAberto===mk? null : mk;
    render();
  });
  document.querySelectorAll("[data-sim]").forEach(td=>td.onclick=e=>{
    e.stopPropagation();
    const [dia,tipo]=td.dataset.sim.split("|");
    const s=simDe(dia);
    const atual=tipo==="rec"?s.rec:s.desp;
    const v=prompt(`Simular ${tipo==="rec"?"receita":"despesa"} em ${dataBR(dia)} (0 para limpar):`, atual?String(atual).replace(".",","):"");
    if(v===null) return;
    DB.simulacoes ||= {};
    DB.simulacoes[dia] ||= {};
    DB.simulacoes[dia][tipo]=parseValor(v);
    if(!(+DB.simulacoes[dia].rec||0) && !(+DB.simulacoes[dia].desp||0)) delete DB.simulacoes[dia];
    salvar(); render(); toast("Simulação atualizada.");
  });
  if(state.secao==="previsao") drawPrevisaoChart();

  /* perfil */
  document.getElementById("pfSalvar")?.addEventListener("click",()=>{
    DB.perfil ||= {};
    DB.perfil.nome=document.getElementById("pfNome").value.trim();
    DB.perfil.fone=document.getElementById("pfFone").value.trim();
    DB.perfil.local=document.getElementById("pfLocal").value.trim();
    DB.perfil.profissao=document.getElementById("pfProf").value.trim();
    DB.perfil.renda=parseValor(document.getElementById("pfRenda").value);
    salvar(); render(); toast("Perfil salvo.");
  });
  document.querySelectorAll("#pfCores [data-tema]").forEach(b=>b.onclick=()=>{
    DB.perfil ||= {}; DB.perfil.corTema=b.dataset.tema;
    aplicarTema(); salvar(); render(); toast("Tema aplicado.");
  });
  document.getElementById("pfExcel")?.addEventListener("click",exportarExcel);
  document.getElementById("pfBackup")?.addEventListener("click",()=>modalBackup());
  document.getElementById("pfSair")?.addEventListener("click",()=>document.getElementById("btnSair")?.click());
}


/* ---------- componentes auxiliares ---------- */
function emptyMini(t,s){ return `<div class="empty">${iconInbox()}<p>${t}</p><span>${s}</span></div>`; }
function emptyBig(t,s){ return `<div class="empty" style="padding:48px 20px">${iconInbox()}<p>${t}</p><span>${s}</span></div>`; }
function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ---------- charts ---------- */
/* Chart.js vem de CDN; se o app abrir sem internet, mostra aviso em vez de quebrar */
function chartIndisponivel(canvasId){
  const c=document.getElementById(canvasId);
  if(c && c.parentElement) c.parentElement.innerHTML='<div class="empty" style="padding:24px 0"><p>Gráfico indisponível offline</p><span>Conecte-se à internet e recarregue a página para ver os gráficos.</span></div>';
}
function chartOpts(legend){
  return {responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:legend,position:"bottom",labels:{boxWidth:12,boxHeight:12,padding:14,font:{family:"Inter",size:11.5,weight:600},color:"#6B7280",usePointStyle:true}},
      tooltip:{backgroundColor:"#111827",padding:11,cornerRadius:9,titleFont:{family:"Inter",weight:700},bodyFont:{family:"Inter"},
        callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
    scales:{x:{grid:{display:false},ticks:{font:{family:"Inter",size:10.5,weight:600},color:"#9CA3AF"}},
      y:{grid:{color:"#F0F1F3"},ticks:{font:{family:"Inter",size:10.5},color:"#9CA3AF",callback:v=>"R$ "+fmtShort(v)}}}};
}
function drawDashboardCharts(){
  const temChart = typeof Chart!=="undefined";
  const mk=state.mes, ano=state.ano;

  /* ---- Balanço Mensal (Ano/Mês · Área/Linha/Barra) ---- */
  const cb=document.getElementById("chBal");
  if(cb && !temChart) chartIndisponivel("chBal");
  else if(cb){
    let labels=[],rec=[],desp=[];
    if(state.balModo==="mes"){
      const n=diasNoMes(mk);
      for(let d=1;d<=n;d++){
        const dia=`${mk}-${String(d).padStart(2,"0")}`;
        labels.push(d);
        rec.push(DB.transacoes.filter(t=>t.data===dia&&t.tipo==="receita").reduce((a,t)=>a+t.valor,0));
        desp.push(DB.transacoes.filter(t=>t.data===dia&&t.tipo==="despesa").reduce((a,t)=>a+t.valor,0));
      }
    } else {
      for(let m=1;m<=12;m++){
        const k=`${ano}-${String(m).padStart(2,"0")}`;
        labels.push(MES_ABR[m-1]);
        rec.push(totalMes(k,"receita")); desp.push(totalMes(k,"despesa"));
      }
    }
    const tipo=state.balTipo||"area";
    const mkDs=(nome,dados,cor,rgba)=> tipo==="barra"
      ? {type:"bar",label:nome,data:dados,backgroundColor:cor,borderRadius:5,maxBarThickness:20}
      : {type:"line",label:nome,data:dados,borderColor:cor,pointBackgroundColor:cor,borderWidth:2.2,pointRadius:2.5,tension:.35,
         fill:tipo==="area",backgroundColor:tipo==="area"?(c)=>{const a=c.chart.ctx.createLinearGradient(0,0,0,250);a.addColorStop(0,rgba+".28)");a.addColorStop(1,rgba+"0)");return a;}:cor};
    charts.bal=new Chart(cb,{data:{labels,datasets:[
      mkDs("Receitas",rec,"#16A34A","rgba(22,163,74,"),
      mkDs("Despesas",desp,"#EF4444","rgba(239,68,68,")
    ]},options:chartOpts(true)});
  }

  /* ---- Análise por Categoria (barras empilhadas por mês) ---- */
  const ca=document.getElementById("chAna");
  if(ca){
    const tipoA=state.anaTipo==="receita"?"receita":"despesa";
    const cats=DB.categorias.filter(c=>c.tipo===tipoA);
    const meses=[]; for(let m=1;m<=12;m++) meses.push(`${ano}-${String(m).padStart(2,"0")}`);
    const dsets=cats.map(c=>({label:c.nome,data:meses.map(k=>somaCatMes(c.id,k,tipoA,true)),backgroundColor:c.cor,borderRadius:3,maxBarThickness:26,stack:"s"}))
      .filter(d=>d.data.some(v=>v>0));
    const total=dsets.reduce((a,d)=>a+d.data.reduce((x,y)=>x+y,0),0);
    const elT=document.getElementById("anaTotal"); if(elT) elT.textContent=fmt(total);
    const elL=document.getElementById("anaLegend");
    if(elL) elL.innerHTML=dsets.slice(0,6).map(d=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-soft)"><span class="dot" style="background:${d.backgroundColor}"></span>${escapeHtml(d.label)}</span>`).join("");
    if(dsets.length && !temChart){ chartIndisponivel("chAna"); }
    else if(dsets.length){
      const op=chartOpts(false);
      op.scales.x.stacked=true; op.scales.y.stacked=true;
      charts.ana=new Chart(ca,{type:"bar",data:{labels:MES_ABR,datasets:dsets},options:op});
    } else {
      ca.parentElement.innerHTML='<div class="empty" style="padding:26px 0">'+iconInbox()+`<p>Sem ${tipoA==="receita"?"receitas":"despesas"} em ${ano}</p></div>`;
    }
  }

  /* ---- modo Crédito: Faturas por mês ---- */
  const cf=document.getElementById("chFat");
  if(cf && !temChart) chartIndisponivel("chFat");
  else if(cf){
    const filtro=state.credCartao||"todos";
    const vals=[]; for(let m=1;m<=12;m++){ const k=`${ano}-${String(m).padStart(2,"0")}`; vals.push(txCartaoMes(k,filtro).reduce((a,t)=>a+t.valor,0)); }
    charts.fat=new Chart(cf,{type:"bar",data:{labels:MES_ABR.map(x=>x.toLowerCase()),
      datasets:[{label:"Fatura",data:vals,backgroundColor:"#3B82F6",borderRadius:5,maxBarThickness:24}]},
      options:chartOpts(false)});
  }
  /* ---- modo Crédito: gastos de cartão por categoria ---- */
  const cd=document.getElementById("chCredDonut");
  if(cd){
    const dados=DB.categorias.filter(c=>c.tipo==="despesa")
      .map(c=>({nome:c.nome,cor:c.cor,icone:c.icone,val:txCartaoMes(mk,state.credCartao).filter(t=>t.categoriaId===c.id).reduce((a,t)=>a+t.valor,0)}))
      .filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
    const total=dados.reduce((a,d)=>a+d.val,0);
    const elT=document.getElementById("credDonutTotal"); if(elT) elT.textContent=fmt(total);
    const leg=document.getElementById("credDonutLegend");
    if(!dados.length){
      cd.parentElement.innerHTML='<div class="empty" style="padding:22px 0">'+iconDown()+'</div>';
      if(leg) leg.innerHTML='<span style="font-size:12px;color:var(--ink-faint);font-weight:600">Nenhum gasto de cartão encontrado</span>';
    } else if(!temChart){
      chartIndisponivel("chCredDonut");
      if(leg) leg.innerHTML=dados.slice(0,6).map(d=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;font-weight:700"><span>${d.icone||""} ${escapeHtml(d.nome)}</span><span class="num">${fmt(d.val)}</span></div>`).join("");
    } else {
      charts.credDonut=new Chart(cd,{type:"doughnut",
        data:{labels:dados.map(d=>d.nome),datasets:[{data:dados.map(d=>d.val),backgroundColor:dados.map(d=>d.cor),borderWidth:0,hoverOffset:6}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"70%",plugins:{legend:{display:false},
          tooltip:{backgroundColor:"#111827",padding:11,cornerRadius:9,callbacks:{label:c=>` ${c.label}: ${fmt(c.parsed)} (${(c.parsed/total*100).toFixed(0)}%)`}}}}});
      if(leg) leg.innerHTML=dados.slice(0,6).map(d=>{
        const p=total>0?d.val/total*100:0;
        return `<div style="padding:5px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="display:flex;align-items:center;gap:7px;min-width:0"><span>${d.icone||""}</span><span style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(d.nome)}</span></span><span class="num" style="font-size:12px;font-weight:800">${fmt(d.val)}</span></div><div class="bar" style="height:5px;margin-top:4px"><i style="width:${p}%;background:${d.cor}"></i></div></div>`;
      }).join("");
    }
  }
  /* ---- modo Investimentos: Evolução Patrimonial ---- */
  const ce=document.getElementById("chEvol");
  if(ce && !temChart) chartIndisponivel("chEvol");
  else if(ce){
    const vals=[]; for(let m=1;m<=12;m++){ const k=`${ano}-${String(m).padStart(2,"0")}`; vals.push(saldoTotalPrevisto(k)+totalInvestido()); }
    charts.evol=new Chart(ce,{type:"line",data:{labels:MES_ABR.map(x=>x.toLowerCase()),
      datasets:[{label:"Patrimônio",data:vals,borderColor:"#2563EB",pointBackgroundColor:"#2563EB",borderWidth:2.2,pointRadius:2.5,tension:.3,
        fill:true,backgroundColor:(x)=>{const a=x.chart.ctx.createLinearGradient(0,0,0,250);a.addColorStop(0,"rgba(37,99,235,.18)");a.addColorStop(1,"rgba(37,99,235,0)");return a;}}]},
      options:chartOpts(false)});
  }
  /* ---- modo Investimentos: alocação da carteira ---- */
  const cl=document.getElementById("chAloc");
  if(cl){
    const grupos={};
    (DB.investimentos||[]).forEach(i=>{ const k=i.tipo||"Outros"; grupos[k]=(grupos[k]||0)+(+i.valorAtual||0); });
    const dados=Object.entries(grupos).map(([nome,val],i)=>({nome,val,cor:PALETA_CORES[(i*4+18)%PALETA_CORES.length]})).filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
    const total=dados.reduce((a,d)=>a+d.val,0);
    const leg=document.getElementById("alocLegend");
    if(!dados.length){
      cl.parentElement.parentElement.innerHTML='<div class="empty" style="padding:60px 0;width:100%"><p style="color:var(--ink-faint);font-weight:600">Sem dados de alocação</p></div>';
    } else if(!temChart){
      chartIndisponivel("chAloc");
      if(leg) leg.innerHTML=dados.map(d=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;font-weight:700"><span><span class="dot" style="background:${d.cor}"></span> ${escapeHtml(d.nome)}</span><span class="num">${fmt(d.val)}</span></div>`).join("");
    } else {
      charts.aloc=new Chart(cl,{type:"doughnut",
        data:{labels:dados.map(d=>d.nome),datasets:[{data:dados.map(d=>d.val),backgroundColor:dados.map(d=>d.cor),borderWidth:0,hoverOffset:6}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{display:false},
          tooltip:{backgroundColor:"#111827",padding:11,cornerRadius:9,callbacks:{label:c=>` ${c.label}: ${fmt(c.parsed)} (${(c.parsed/total*100).toFixed(0)}%)`}}}}});
      if(leg) leg.innerHTML=dados.map(d=>{
        const p=total>0?d.val/total*100:0;
        return `<div style="padding:5px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${d.cor}"></span><span style="font-size:12px;font-weight:700">${escapeHtml(d.nome)}</span></span><span class="num" style="font-size:12px;font-weight:800">${fmt(d.val)} <span style="color:var(--ink-faint);font-weight:700;font-size:11px">${p.toFixed(0)}%</span></span></div></div>`;
      }).join("");
    }
  }

  /* ---- Gastos por Categoria (donut + legenda com barras) ---- */
  const donut=document.getElementById("chDonut"), leg=document.getElementById("donutLegend");
  if(donut){
    const cats=DB.categorias.filter(c=>c.tipo==="despesa");
    const dados=cats.map(c=>({nome:c.nome,cor:c.cor,icone:c.icone,val:somaCatMes(c.id,mk,"despesa",!!state.gastosPend)})).filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
    const total=dados.reduce((a,d)=>a+d.val,0);
    const elT=document.getElementById("donutTotal"); if(elT) elT.textContent=fmt(total);
    if(!dados.length){
      donut.parentElement.innerHTML='<div class="empty" style="padding:22px 0">'+iconInbox()+'<p>Sem despesas</p></div>';
      if(leg) leg.innerHTML='<span style="font-size:12.5px;color:var(--ink-faint);font-weight:600">Nenhuma despesa neste mês.</span>';
    } else if(!temChart){ chartIndisponivel("chDonut");
      if(leg) leg.innerHTML=dados.slice(0,6).map(d=>{
        const p=total>0?d.val/total*100:0;
        return `<div style="padding:5px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="display:flex;align-items:center;gap:7px;min-width:0"><span>${d.icone||""}</span><span style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(d.nome)}</span></span><span class="num" style="font-size:12px;font-weight:800">${fmt(d.val)}</span></div><div class="bar" style="height:5px;margin-top:4px"><i style="width:${p}%;background:${d.cor}"></i></div></div>`;
      }).join("");
    } else {
      charts.donut=new Chart(donut,{type:"doughnut",
        data:{labels:dados.map(d=>d.nome),datasets:[{data:dados.map(d=>d.val),backgroundColor:dados.map(d=>d.cor),borderWidth:0,hoverOffset:6}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"70%",plugins:{legend:{display:false},
          tooltip:{backgroundColor:"#111827",padding:11,cornerRadius:9,callbacks:{label:c=>` ${c.label}: ${fmt(c.parsed)} (${(c.parsed/total*100).toFixed(0)}%)`}}}}});
      if(leg) leg.innerHTML=dados.slice(0,6).map(d=>{
        const p=total>0?d.val/total*100:0;
        return `<div style="padding:5px 0">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span style="display:flex;align-items:center;gap:7px;min-width:0"><span>${d.icone||""}</span><span style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(d.nome)}</span></span>
            <span style="white-space:nowrap"><span class="num" style="font-size:12px;font-weight:800">${fmt(d.val)}</span> <span class="num" style="font-size:11px;font-weight:700;color:var(--ink-faint)">${p.toFixed(0)}%</span></span>
          </div>
          <div class="bar" style="height:5px;margin-top:4px"><i style="width:${p}%;background:${d.cor}"></i></div>
        </div>`;
      }).join("");
    }
  }
}

const overlay=document.getElementById("overlay");
function openModal(html){ overlay.innerHTML=`<div class="modal">${html}</div>`; overlay.classList.add("show"); }
function closeModal(){ overlay.classList.remove("show"); overlay.innerHTML=""; }
// Delegação: fecha ao clicar no fundo OU em QUALQUER botão com [data-close]
// (X do topo, "Cancelar" e "Concluir") — inclusive em ícones internos.
overlay.addEventListener("click",e=>{ if(e.target===overlay || e.target.closest("[data-close]")) closeModal(); });
function modalHead(t){ return `<div class="modal-head"><h2>${t}</h2><button class="icon-btn" data-close><svg viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`; }

/* ---- lançamento ---- */
function modalTransacao(edit){
  const t=edit||{tipo:"despesa",status:"efetivado",data:hoje(),contaId:DB.contas[0]?.id};
  const opcCat=tp=>DB.categorias.filter(c=>c.tipo===tp).map(c=>`<option value="${c.id}" ${c.id===t.categoriaId?"selected":""}>${c.icone} ${escapeHtml(c.nome)}</option>`).join("");
  const contasOpc=(selId,allowEmpty)=>DB.contas.filter(c=>!c.arquivada).map(c=>`<option value="${c.id}" ${c.id===selId?"selected":""}>${escapeHtml(c.nome)}</option>`).join("");
  const origDef = t.contaId || DB.contas[0]?.id;
  const destDef = t.contaDestinoId || DB.contas.find(c=>c.id!==origDef)?.id || DB.contas[0]?.id;
  openModal(`${modalHead(edit?"Editar lançamento":"Novo lançamento")}
  <div class="modal-body">
    <div class="type-toggle" id="ttip" style="grid-template-columns:1fr 1fr 1fr">
      <button type="button" data-tp="receita" class="${t.tipo==="receita"?"on-rec":""}">↑ Receita</button>
      <button type="button" data-tp="despesa" class="${t.tipo==="despesa"?"on-desp":""}">↓ Despesa</button>
      <button type="button" data-tp="transferencia" class="${t.tipo==="transferencia"?"on-trans":""}">⇄ Transferência</button>
    </div>
    <div class="field"><label>Valor</label><input id="fVal" inputmode="decimal" placeholder="0,00" value="${edit?String(t.valor).replace(".",","):""}"></div>
    <div class="field"><label>Descrição</label><input id="fDesc" placeholder="Ex.: Mercado, Salário..." value="${escapeHtml(t.descricao||"")}"></div>
    <div class="field ${t.tipo==="transferencia"?"hidden":""}" id="fRowCatConta"><div class="row2">
      <div><label>Categoria</label><select id="fCat">${opcCat(t.tipo==="transferencia"?"despesa":t.tipo)}</select></div>
      <div><label>Conta</label><select id="fConta">${contasOpc(t.contaId)}</select></div>
    </div>
    ${(DB.cartoes||[]).length?`<div style="margin-top:12px"><label>Cartão (opcional)</label><select id="fCartao"><option value="">— sem cartão —</option>${DB.cartoes.map(cc=>`<option value="${cc.id}" ${cc.id===t.cartaoId?"selected":""}>${escapeHtml(cc.nome)}</option>`).join("")}</select></div>`:""}</div>
    <div class="field ${t.tipo==="transferencia"?"":"hidden"}" id="fRowTransfer"><div class="row2">
      <div><label>De (origem)</label><select id="fContaOrig">${contasOpc(origDef)}</select></div>
      <div><label>Para (destino)</label><select id="fContaDest">${contasOpc(destDef)}</select></div>
    </div>
    <div style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:6px;line-height:1.4">A transferência sai da conta de origem e entra na de destino. Não conta como receita nem despesa.</div></div>
    <div class="field"><label>Data</label><input id="fData" type="date" value="${t.data}"></div>
    <label class="check"><input type="checkbox" id="fPend" ${t.status==="pendente"?"checked":""}><span>Lançamento futuro / agendado (não entra no saldo até ser efetivado)</span></label>
    ${edit&&t.recorrenciaId?`<div class="field" id="fScopeWrap" style="margin-top:14px"><label>Aplicar esta alteração a</label>
      <div class="seg" id="fScope" style="display:flex;width:100%">
        <button type="button" data-scope="uma" class="on" style="flex:1">Apenas este mês</button>
        <button type="button" data-scope="futuras" style="flex:1">Deste mês em diante</button>
      </div>
      <div style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:6px;line-height:1.45">Este lançamento é fixo/recorrente. <b>Apenas este mês</b> muda só esta ocorrência; <b>deste mês em diante</b> passa a valer também para os próximos períodos.</div></div>`:""}
    ${!edit?`<div id="fRepBlock"><label class="check" style="margin-top:10px"><input type="checkbox" id="fRep"><span>Repetir — tornar um lançamento fixo (cria uma recorrência)</span></label>
    <div class="field hidden" id="fRepWrap" style="margin-top:12px"><label>Frequência da repetição</label><select id="fRepFreq">${Object.entries(FREQS).map(([k,v])=>`<option value="${k}" ${k==="mensal"?"selected":""}>${v.nome}</option>`).join("")}</select>
      <div style="margin-top:12px"><label>Duração</label>
        <div class="seg" id="fRepDur" style="display:flex;width:100%">
          <button type="button" data-dur="sempre" class="on" style="flex:1">Sempre (fixa)</button>
          <button type="button" data-dur="periodo" style="flex:1">Por um período</button>
        </div>
      </div>
      <div class="row2 hidden" id="fRepPerWrap" style="margin-top:10px">
        <div><label>Repetir por</label><input id="fRepQtd" inputmode="numeric" value="12"></div>
        <div><label>Unidade</label><select id="fRepUnid"><option value="meses">meses</option><option value="anos">anos</option></select></div>
      </div>
      <div id="fRepHint" style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:8px">Este lançamento vale para agora; os próximos períodos serão agendados automaticamente.</div></div></div>`:""}
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="fSave">${edit?"Salvar":"Adicionar"}</button>
    </div>
  </div>`);
  let tipo=t.tipo;
  const setTipo=tp=>{ tipo=tp;
    const cls= tp==="receita"?"on-rec": tp==="despesa"?"on-desp":"on-trans";
    document.querySelectorAll("#ttip button").forEach(b=>{b.className=b.dataset.tp===tp?cls:"";});
    const ehTransf = tp==="transferencia";
    document.getElementById("fRowCatConta").classList.toggle("hidden", ehTransf);
    document.getElementById("fRowTransfer").classList.toggle("hidden", !ehTransf);
    const repBlock=document.getElementById("fRepBlock");
    if(repBlock) repBlock.classList.toggle("hidden", ehTransf); // transferências não viram recorrência
    document.getElementById("fDesc").placeholder = ehTransf ? "Ex.: Reserva, Pagamento de fatura..." : "Ex.: Mercado, Salário...";
    if(!ehTransf) document.getElementById("fCat").innerHTML=opcCat(tp);
  };
  document.querySelectorAll("#ttip button").forEach(b=>b.onclick=()=>setTipo(b.dataset.tp));
  if(t.tipo==="transferencia") setTipo("transferencia");

  // Data futura → marca automaticamente como agendado (não entra no saldo até a data chegar)
  const _fData=document.getElementById("fData");
  const _fPend=document.getElementById("fPend");
  const avisarFuturo=()=>{
    const fut = _fData.value && _fData.value>hoje();
    if(fut && !_fPend.checked) _fPend.checked=true;
    let nota=document.getElementById("fFuturoNota");
    if(fut){
      if(!nota){ nota=document.createElement("div"); nota.id="fFuturoNota"; nota.style.cssText="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:6px;line-height:1.4"; _fPend.closest("label").insertAdjacentElement("afterend",nota); }
      nota.textContent="Data futura: ficará como agendado e só entra no saldo da conta quando a data chegar (ou ao confirmar com o ✓).";
    } else if(nota){ nota.remove(); }
  };
  _fData.addEventListener("change",avisarFuturo);
  avisarFuturo();

  let repDur="sempre", escopo="uma";
  function calcDataFimRep(){
    const qtd=parseInt(document.getElementById("fRepQtd")?.value)||0;
    if(qtd<=0) return null;
    const unid=document.getElementById("fRepUnid")?.value||"meses";
    const base=document.getElementById("fData").value||hoje();
    const meses=unid==="anos"?qtd*12:qtd;
    return addDias(addMesData(base,meses),-1);
  }
  if(!edit){
    const fRep=document.getElementById("fRep");
    const fRepWrap=document.getElementById("fRepWrap");
    const fRepPerWrap=document.getElementById("fRepPerWrap");
    const fRepHint=document.getElementById("fRepHint");
    const atualizarHintRep=()=>{
      if(repDur==="periodo"){
        const fim=calcDataFimRep();
        fRepHint.innerHTML = fim ? `Repete a partir de agora e termina em <b>${dataBR(fim)}</b>.` : "Informe por quanto tempo a repetição deve durar.";
      } else {
        fRepHint.textContent="Lançamento fixo, sem data para terminar — os próximos períodos são agendados automaticamente.";
      }
    };
    fRep.onchange=()=>fRepWrap.classList.toggle("hidden",!fRep.checked);
    document.querySelectorAll("#fRepDur button").forEach(b=>b.onclick=()=>{
      repDur=b.dataset.dur;
      document.querySelectorAll("#fRepDur button").forEach(x=>x.classList.toggle("on",x.dataset.dur===repDur));
      fRepPerWrap.classList.toggle("hidden",repDur!=="periodo");
      atualizarHintRep();
    });
    ["fRepQtd","fRepUnid","fRepFreq","fData"].forEach(id=>{ const el=document.getElementById(id); if(el){ el.addEventListener("input",atualizarHintRep); el.addEventListener("change",atualizarHintRep); } });
  }
  if(edit && t.recorrenciaId){
    document.querySelectorAll("#fScope button").forEach(b=>b.onclick=()=>{
      escopo=b.dataset.scope;
      document.querySelectorAll("#fScope button").forEach(x=>x.classList.toggle("on",x.dataset.scope===escopo));
    });
  }
  document.getElementById("fSave").onclick=()=>{
    const valor=parseValor(document.getElementById("fVal").value);
    if(valor<=0){ toast("Informe um valor válido.","err"); return; }
    if(edit && !DB.transacoes.some(x=>x.id===t.id)){ toast("Este lançamento foi alterado em outro aparelho. A tela foi atualizada.","err"); closeModal(); render(); return; }
    const ehTransf = tipo==="transferencia";
    let campos;
    if(ehTransf){
      const orig=document.getElementById("fContaOrig").value;
      const dest=document.getElementById("fContaDest").value;
      if(!orig || !dest){ toast("Escolha as contas de origem e destino.","err"); return; }
      if(orig===dest){ toast("Origem e destino devem ser contas diferentes.","err"); return; }
      campos={ tipo:"transferencia", valor,
        descricao:document.getElementById("fDesc").value.trim(),
        categoriaId:null, contaId:orig, contaDestinoId:dest, cartaoId:null,
        data:document.getElementById("fData").value||hoje(),
        status:document.getElementById("fPend").checked?"pendente":"efetivado",
        recorrenciaId:null, recorrente:false, competencia:null };
    } else {
      campos={ tipo, valor,
        descricao:document.getElementById("fDesc").value.trim(),
        categoriaId:document.getElementById("fCat").value,
        contaId:document.getElementById("fConta").value,
        cartaoId:(document.getElementById("fCartao")||{}).value||null,
        contaDestinoId:null,
        data:document.getElementById("fData").value||hoje(),
        status:document.getElementById("fPend").checked?"pendente":"efetivado" };
    }
    let msg;
    if(edit && t.recorrenciaId && !ehTransf){
      msg=editarRecorrenteOcorrencia(t, campos, escopo);
    } else if(edit){
      const i=DB.transacoes.findIndex(x=>x.id===t.id);
      DB.transacoes[i]={ ...t, id:t.id, ...campos };
      msg="Lançamento atualizado.";
    } else {
      const obj={ id:uid(), ...campos };
      DB.transacoes.push(obj);
      if(!ehTransf && document.getElementById("fRep")?.checked){
        const freq=document.getElementById("fRepFreq").value;
        let dataFim=null;
        if(repDur==="periodo"){
          dataFim=calcDataFimRep();
          if(!dataFim){ toast("Informe por quanto tempo a repetição deve durar.","err"); return; }
        }
        criarRecorrenciaDeLancamento(obj, freq, dataFim);
        sincronizarRecorrencias();
        msg = dataFim ? "Lançamento adicionado e repetição criada." : "Lançamento adicionado e recorrência fixa criada.";
      } else {
        msg = ehTransf ? "Transferência registrada." : "Lançamento adicionado.";
      }
    }
    salvar(); closeModal(); render(); toast(msg);
  };
}

/* ---- excluir lançamento (com opção de série, p/ recorrentes) ---- */
function modalExcluirTx(t){
  const ehRec=!!t.recorrenciaId;
  const nome=escapeHtml(t.descricao || (t.tipo==="transferencia"?"Transferência":catNome(t.categoriaId)));
  if(!ehRec){
    openModal(`${modalHead("Excluir lançamento")}
    <div class="modal-body">
      <div style="font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.5">Excluir <b>${nome}</b> de ${dataBR(t.data)}? Esta ação não pode ser desfeita.</div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="xConf">Excluir</button></div>
    </div>`);
    document.getElementById("xConf").onclick=()=>{
      DB.transacoes=DB.transacoes.filter(x=>x.id!==t.id);
      salvar(); closeModal(); render(); toast("Lançamento excluído.");
    };
    return;
  }
  openModal(`${modalHead("Excluir lançamento fixo")}
  <div class="modal-body">
    <div style="font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1.5;margin-bottom:14px"><b style="color:var(--ink)">${nome}</b> é um lançamento fixo/recorrente. O que você quer excluir?</div>
    <div class="seg" id="xScope" style="display:flex;flex-direction:column;width:100%;gap:6px;background:transparent;border:none;padding:0">
      <button type="button" data-x="uma" class="on" style="text-align:left;padding:12px 14px;border:1.5px solid var(--brand);border-radius:11px;background:var(--brand-soft);color:var(--ink)"><b>Apenas este mês</b><div style="font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px">Remove só esta ocorrência (${dataBR(t.data)}). A recorrência segue ativa.</div></button>
      <button type="button" data-x="serie" style="text-align:left;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--ink)"><b>Deste mês em diante</b><div style="font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px">Encerra a recorrência: remove esta e as próximas. O histórico já efetivado é mantido.</div></button>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="xConf">Excluir</button></div>
  </div>`);
  let escopo="uma";
  document.querySelectorAll("#xScope button").forEach(b=>b.onclick=()=>{
    escopo=b.dataset.x;
    document.querySelectorAll("#xScope button").forEach(x=>{
      const on=x===b;
      x.classList.toggle("on",on);
      x.style.borderColor=on?"var(--brand)":"var(--border)";
      x.style.background=on?"var(--brand-soft)":"var(--surface-2)";
    });
  });
  document.getElementById("xConf").onclick=()=>{
    if(escopo==="serie"){ excluirRecorrenteSerie(t); } else { excluirRecorrenteUma(t); }
    salvar(); closeModal(); render(); toast(escopo==="serie"?"Recorrência encerrada.":"Ocorrência excluída.");
  };
}

/* ---- recorrência (receita/despesa fixa) ---- */
function modalRecorrencia(edit){
  const r=edit||{tipo:"despesa",valor:0,descricao:"",categoriaId:null,contaId:DB.contas[0]?.id,frequencia:"mensal",dataInicio:hoje(),dataFim:"",lancarStatus:"pendente",ativa:true,puladas:[]};
  const opcCat=tp=>DB.categorias.filter(c=>c.tipo===tp).map(c=>`<option value="${c.id}" ${c.id===r.categoriaId?"selected":""}>${c.icone} ${escapeHtml(c.nome)}</option>`).join("");
  const freqOpts=Object.entries(FREQS).map(([k,v])=>`<option value="${k}" ${k===r.frequencia?"selected":""}>${v.nome}</option>`).join("");
  const durIni = edit ? duracaoDeRegra(r) : {modo:"sempre", qtd:12, unid:"meses"};
  const horizonRef=ultimoDiaMes(addMes(mesAtual(),18));
  const mesesRef = edit ? [...new Set(ocorrenciasRegra(r,horizonRef).filter(d=>d.slice(0,7)>=mesAtual()).map(d=>d.slice(0,7)))] : [];
  if(edit && !mesesRef.length) mesesRef.push(mesAtual());
  const mesRefOpts = mesesRef.map(m=>`<option value="${m}">${nomeMes(m)}</option>`).join("");
  openModal(`${modalHead(edit?"Editar recorrência":"Nova recorrência")}
  <div class="modal-body">
    <div class="type-toggle" id="rtip">
      <button type="button" data-tp="receita" class="${r.tipo==="receita"?"on-rec":""}">↑ Receita fixa</button>
      <button type="button" data-tp="despesa" class="${r.tipo==="despesa"?"on-desp":""}">↓ Despesa fixa</button>
    </div>
    <div class="field"><label>Valor</label><input id="rVal" inputmode="decimal" placeholder="0,00" value="${edit?String(r.valor).replace(".",","):""}"></div>
    <div class="field"><label>Descrição</label><input id="rDesc" placeholder="Ex.: Aluguel, Salário, Netflix..." value="${escapeHtml(r.descricao||"")}"></div>
    <div class="field"><div class="row2">
      <div><label>Categoria</label><select id="rCat">${opcCat(r.tipo)}</select></div>
      <div><label>Conta</label><select id="rConta">${DB.contas.filter(c=>!c.arquivada).map(c=>`<option value="${c.id}" ${c.id===r.contaId?"selected":""}>${escapeHtml(c.nome)}</option>`).join("")}</select></div>
    </div></div>
    <div class="field"><div class="row2">
      <div><label>Frequência</label><select id="rFreq">${freqOpts}</select></div>
      <div><label>Início (1º lançamento)</label><input id="rIni" type="date" value="${r.dataInicio||hoje()}"></div>
    </div></div>
    <div class="field"><label>Duração</label>
      <div class="seg" id="rDur" style="display:flex;width:100%">
        <button type="button" data-dur="sempre" class="${durIni.modo==="sempre"?"on":""}" style="flex:1">Sempre (fixa)</button>
        <button type="button" data-dur="periodo" class="${durIni.modo==="periodo"?"on":""}" style="flex:1">Por um período</button>
      </div>
      <div class="row2 ${durIni.modo==="periodo"?"":"hidden"}" id="rPerWrap" style="margin-top:10px">
        <div><label>Repetir por</label><input id="rQtd" inputmode="numeric" value="${durIni.qtd}"></div>
        <div><label>Unidade</label><select id="rUnid"><option value="meses" ${durIni.unid==="meses"?"selected":""}>meses</option><option value="anos" ${durIni.unid==="anos"?"selected":""}>anos</option></select></div>
      </div>
      <div id="rDurHint" style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:8px"></div>
    </div>
    <label class="check"><input type="checkbox" id="rEfet" ${r.lancarStatus==="efetivado"?"checked":""}><span>Lançar já como efetivado (entra direto no saldo). Desmarcado, cada lançamento entra como agendado para você confirmar.</span></label>
    ${edit?`<div class="field" id="rScopeWrap" style="margin-top:14px"><label>Aplicar esta alteração a</label>
      <div class="seg" id="rScope" style="display:flex;width:100%;flex-wrap:wrap;gap:2px">
        <button type="button" data-scope="serie" class="on" style="flex:1 1 30%">Toda a série</button>
        <button type="button" data-scope="futuras" style="flex:1 1 30%">Deste mês em diante</button>
        <button type="button" data-scope="mes" style="flex:1 1 30%">Apenas um mês</button>
      </div>
      <div class="field hidden" id="rMesWrap" style="margin-top:10px"><label>Mês de referência</label><select id="rMesRef">${mesRefOpts}</select></div>
      <div id="rScopeHint" style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:8px">Altera a regra inteira: passado efetivado é mantido e os próximos períodos são reagendados com os novos valores.</div>
    </div>`:""}
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="rSave">${edit?"Salvar":"Criar recorrência"}</button>
    </div>
  </div>`);
  let tipo=r.tipo;
  const setTipo=tp=>{ tipo=tp;
    document.querySelectorAll("#rtip button").forEach(b=>{b.className=b.dataset.tp===tp?(tp==="receita"?"on-rec":"on-desp"):"";});
    document.getElementById("rCat").innerHTML=opcCat(tp);
  };
  document.querySelectorAll("#rtip button").forEach(b=>b.onclick=()=>setTipo(b.dataset.tp));

  let durModo=durIni.modo, escopo="serie";
  const rPerWrap=document.getElementById("rPerWrap");
  const rDurHint=document.getElementById("rDurHint");
  const lerDur=()=>({modo:durModo, qtd:document.getElementById("rQtd").value, unid:document.getElementById("rUnid").value});
  const baseParaFim=()=>{
    if(escopo==="futuras" && document.getElementById("rMesRef")){
      const ym=document.getElementById("rMesRef").value;
      const dia=Number((document.getElementById("rIni").value||hoje()).split("-")[2])||1;
      return `${ym}-${String(Math.min(dia,diasNoMes(ym))).padStart(2,"0")}`;
    }
    return document.getElementById("rIni").value||hoje();
  };
  const atualizarDurHint=()=>{
    if(durModo==="periodo"){ const fim=calcFimDuracao(baseParaFim(), lerDur()); rDurHint.innerHTML = fim?`Repete a partir do início e termina em <b>${dataBR(fim)}</b>.`:"Informe por quanto tempo deve durar."; }
    else rDurHint.textContent="Recorrência fixa, sem data para terminar.";
  };
  document.querySelectorAll("#rDur button").forEach(b=>b.onclick=()=>{ durModo=b.dataset.dur; document.querySelectorAll("#rDur button").forEach(x=>x.classList.toggle("on",x.dataset.dur===durModo)); rPerWrap.classList.toggle("hidden",durModo!=="periodo"); atualizarDurHint(); });
  ["rQtd","rUnid","rIni"].forEach(id=>{ const el=document.getElementById(id); if(el){ el.addEventListener("input",atualizarDurHint); el.addEventListener("change",atualizarDurHint); } });
  if(edit){
    const hints={ serie:"Altera a regra inteira: o passado efetivado é mantido e os próximos períodos são reagendados com os novos valores.", futuras:"Mantém os meses anteriores como estão e passa a valer do mês de referência em diante (divide a série).", mes:"Altera somente a ocorrência do mês escolhido, sem mexer nos demais." };
    const rScopeHint=document.getElementById("rScopeHint");
    const rMesWrap=document.getElementById("rMesWrap");
    document.querySelectorAll("#rScope button").forEach(b=>b.onclick=()=>{ escopo=b.dataset.scope; document.querySelectorAll("#rScope button").forEach(x=>x.classList.toggle("on",x.dataset.scope===escopo)); rMesWrap.classList.toggle("hidden",escopo==="serie"); rScopeHint.textContent=hints[escopo]; atualizarDurHint(); });
    const rMesSel=document.getElementById("rMesRef"); if(rMesSel) rMesSel.addEventListener("change",atualizarDurHint);
  }
  atualizarDurHint();

  document.getElementById("rSave").onclick=()=>{
    const valor=parseValor(document.getElementById("rVal").value);
    if(valor<=0){ toast("Informe um valor válido.","err"); return; }
    if(durModo==="periodo" && (parseInt(document.getElementById("rQtd").value)||0)<=0){ toast("Informe por quanto tempo a repetição deve durar.","err"); return; }
    const ini=document.getElementById("rIni").value||hoje();
    const campos={ tipo, valor,
      descricao:document.getElementById("rDesc").value.trim(),
      categoriaId:document.getElementById("rCat").value,
      contaId:document.getElementById("rConta").value,
      frequencia:document.getElementById("rFreq").value,
      dataInicio:ini,
      lancarStatus:document.getElementById("rEfet").checked?"efetivado":"pendente" };
    const dur=lerDur();
    let msg;
    if(edit){
      const mesRef = (escopo!=="serie") ? document.getElementById("rMesRef").value : null;
      msg=aplicarEdicaoRegra(r, campos, dur, escopo, mesRef);
    } else {
      const obj={ id:uid(), ...campos, dataFim:calcFimDuracao(ini,dur), diaBase:Number(ini.split("-")[2]), ativa:true, puladas:[] };
      DB.recorrencias.push(obj);
      sincronizarRecorrencias();
      msg="Recorrência criada. Os lançamentos já foram agendados.";
    }
    salvar(); closeModal(); render(); toast(msg);
  };
}

        <div style="font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">Benefícios e cartões corporativos</div>

  function calcAtual(){

    let quitHtml="";
    if(modo==="parcelado"){
      const q=parseValor(document.getElementById("dQuit").value);
      if(q>0 && ab>0){
        const eco=Math.max(ab-q,0);
        quitHtml=`<div style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;flex-wrap:wrap">

  }
  /* soma automática das faturas agrupadas por mês (todos os cartões) */
  function atualizarMesTotais(){
    const el=document.getElementById("dMesTotais"); if(!el) return;
    const porMes={};
    faturas.forEach(f=>{
      if(!(f.valor>0)) return;
      const k=f.mes||"sem-mes";

      if(f.paga) porMes[k].pago+=f.valor;

    if(!meses.length){ el.innerHTML=""; return; }
    const lblMes=k=>{ if(k==="sem-mes") return "Sem mês"; const [y,m]=k.split("-").map(Number); return MES_ABR[m-1]+"/"+y; };
