      <div style="font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Total por mês</div>
      ${meses.map(k=>{const m=porMes[k]; const aberto=m.total-m.pago;
        return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;padding:3px 0;flex-wrap:wrap">
          <span style="color:var(--ink)">${lblMes(k)} <span style="color:var(--ink-faint);font-weight:600">· ${m.n} fatura${m.n>1?"s":""}</span></span>
          <span class="num" style="color:var(--ink-soft)">${fmt(m.total)}${aberto>0&&m.pago>0?` <span style="color:var(--expense)">(${fmt(aberto)} em aberto)</span>`:aberto<=0?' <span class="pos">✓ pago</span>':""}</span>
        </div>`;}).join("")}
    </div>`;
  }
  function renderFaturas(){
    const cont=document.getElementById("dFaturas");
    if(!faturas.length) faturas.push({id:uid(),cartao:"",mes:mesAtual(),valor:0,paga:false});
    cont.innerHTML=faturas.map((f,i)=>`<div class="fat-row">
        <input class="fcard" data-fcard="${i}" placeholder="Cartão (ex.: Nubank)" value="${escapeHtml(f.cartao||'')}">
        <input type="month" data-fmes="${i}" value="${f.mes||''}">
        <input class="fval" inputmode="decimal" data-fval="${i}" placeholder="0,00" value="${f.valor?String(f.valor).replace('.',','):''}">
        <label class="fat-chk" title="Fatura já paga"><input type="checkbox" data-fpaga="${i}" ${f.paga?'checked':''}>paga</label>
        <button type="button" class="icon-btn danger" data-frem="${i}" title="Remover">${trash}</button>
      </div>`).join("");
    cont.querySelectorAll("[data-fcard]").forEach(inp=>inp.oninput=()=>{ faturas[+inp.dataset.fcard].cartao=inp.value; });
    cont.querySelectorAll("[data-fmes]").forEach(inp=>inp.oninput=()=>{ faturas[+inp.dataset.fmes].mes=inp.value; atualizarMesTotais(); });
    cont.querySelectorAll("[data-fval]").forEach(inp=>inp.oninput=()=>{ faturas[+inp.dataset.fval].valor=parseValor(inp.value); atualizarPreview(); });
    cont.querySelectorAll("[data-fpaga]").forEach(inp=>inp.onchange=()=>{ faturas[+inp.dataset.fpaga].paga=inp.checked; atualizarPreview(); });
    cont.querySelectorAll("[data-frem]").forEach(b=>b.onclick=()=>{ faturas.splice(+b.dataset.frem,1); renderFaturas(); atualizarPreview(); });
    atualizarMesTotais();
  }
  function aplicarModo(){
    grpS.style.display = modo==="simples"?"":"none";
    grpP.style.display = modo==="parcelado"?"":"none";
    grpC.style.display = modo==="cartao"?"":"none";
    document.querySelectorAll("#dModoSeg button").forEach(b=>b.classList.toggle("on",b.dataset.modo===modo));
    if(modo==="cartao") renderFaturas();
    atualizarPreview();
  }
  document.querySelectorAll("#dModoSeg button").forEach(b=>b.onclick=()=>{ modo=b.dataset.modo; aplicarModo(); });
  document.getElementById("dAddFatura").onclick=()=>{ const last=faturas[faturas.length-1]; faturas.push({id:uid(),cartao:(last&&last.cartao)||"",mes:(last&&last.mes)||mesAtual(),valor:0,paga:false}); renderFaturas(); atualizarPreview(); };
  ["dTotal","dPago","dParcTot","dParcVal","dParcPagas","dQuit"].forEach(idf=>{ const el=document.getElementById(idf); if(el) el.oninput=atualizarPreview; });
  aplicarModo();

  document.getElementById("dSave").onclick=()=>{
    const nome=document.getElementById("dNome").value.trim();
    if(!nome){ toast("Dê um nome à dívida.","err"); return; }
    const base={ id:edit?d.id:uid(), nome, credor:document.getElementById("dCredor").value.trim(), vencimento:document.getElementById("dVenc").value, cor, icone, modo };
    let obj;
    if(modo==="parcelado"){
      const nt=parseInt(document.getElementById("dParcTot").value)||0;
      const vp=parseValor(document.getElementById("dParcVal").value);
      let np=parseInt(document.getElementById("dParcPagas").value)||0;
      if(nt<=0){ toast("Informe o número de parcelas.","err"); return; }
      if(vp<=0){ toast("Informe o valor de cada parcela.","err"); return; }
      np=Math.max(0,Math.min(np,nt));
      let vq=parseValor(document.getElementById("dQuit").value); if(vq<0) vq=0;
      obj={...base, parcelasTotal:nt, parcelasPagas:np, valorParcela:vp, valorTotal:nt*vp, valorPago:np*vp, valorQuitacao:vq};
    } else if(modo==="cartao"){
      const fs=faturas.filter(f=>(f.valor||0)>0).map(f=>({...f, cartao:(f.cartao||"").trim()}));
      if(!fs.length){ toast("Adicione ao menos uma fatura com valor.","err"); return; }
      obj={...base, faturas:fs, valorTotal:fs.reduce((a,f)=>a+f.valor,0), valorPago:fs.filter(f=>f.paga).reduce((a,f)=>a+f.valor,0)};
    } else {
      const tot=parseValor(document.getElementById("dTotal").value);
      if(tot<=0){ toast("Informe o valor total da dívida.","err"); return; }
      let pago=parseValor(document.getElementById("dPago").value); if(pago<0)pago=0; if(pago>tot)pago=tot;
      obj={...base, valorTotal:tot, valorPago:pago};
    }
    if(edit){ const i=DB.dividas.findIndex(x=>x.id===d.id); if(i>=0) DB.dividas[i]=obj; else DB.dividas.push(obj); } else DB.dividas.push(obj);
    salvar(); closeModal(); render(); toast(edit?"Dívida atualizada.":"Dívida cadastrada.");
  };
}
function modalPagarDivida(id){
  const d=DB.dividas.find(x=>x.id===id); if(!d) return;
  const ab=dividaAberto(d);
  /* parcelada: dá baixa em N parcelas */
  if(d.modo==="parcelado"){
    const restantes=Math.max((d.parcelasTotal||0)-(d.parcelasPagas||0),0);
    if(restantes<=0){ toast("Todas as parcelas já foram pagas.","err"); return; }
    openModal(`${modalHead("Registrar pagamento")}
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:12px">Quantas parcelas de <strong>${escapeHtml(d.nome)}</strong> você quer dar como pagas? Restam <strong>${restantes}</strong> (${fmt(ab)}) · ${fmt(d.valorParcela||0)} cada.</div>
      <div class="field"><label>Parcelas a pagar agora</label><input id="pParc" inputmode="numeric" value="1" autofocus></div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="pSave">Registrar</button></div>
    </div>`);
    document.getElementById("pSave").onclick=()=>{
      let n=parseInt(document.getElementById("pParc").value)||0;
      if(n<=0){ toast("Informe quantas parcelas.","err"); return; }
      const dd=DB.dividas.find(x=>x.id===d.id);
      if(!dd){ toast("Esta dívida foi alterada em outro aparelho.","err"); closeModal(); render(); return; }
      n=Math.min(n,restantes);
      dd.parcelasPagas=Math.min((dd.parcelasPagas||0)+n, dd.parcelasTotal||((dd.parcelasPagas||0)+n));
      dd.valorPago=dd.parcelasPagas*(dd.valorParcela||0);
      const quitou=dividaAberto(dd)<=0;
      salvar(); closeModal(); render(); toast(quitou?"Dívida quitada! 🎉":`${n} parcela(s) registrada(s).`);
    };
    return;
  }
  /* cartão: marca faturas como pagas */
  if(d.modo==="cartao"){
    const pend=(d.faturas||[]).map((f,i)=>({f,i}))
      .filter(o=>!o.f.paga && (o.f.valor||0)>0)
      .sort((a,b)=>((a.f.mes||"")+(a.f.cartao||"")).localeCompare((b.f.mes||"")+(b.f.cartao||"")));
    if(!pend.length){ toast("Não há faturas em aberto.","err"); return; }
    openModal(`${modalHead("Registrar pagamento")}
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:12px">Marque as faturas de <strong>${escapeHtml(d.nome)}</strong> que você já pagou:</div>
      <div>${pend.map(o=>`<label class="check" style="margin-bottom:8px"><input type="checkbox" data-fp="${o.i}"><span style="flex:1">${o.f.cartao?`<b>${escapeHtml(o.f.cartao)}</b> · `:""}${o.f.mes?nomeMes(o.f.mes):"Fatura"} <span class="num" style="color:var(--ink-soft);font-weight:600"> · ${fmt(o.f.valor)}</span></span></label>`).join("")}</div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="pSave">Registrar</button></div>
    </div>`);
    document.getElementById("pSave").onclick=()=>{
      const marc=[...document.querySelectorAll("[data-fp]:checked")].map(c=>+c.dataset.fp);
      if(!marc.length){ toast("Selecione ao menos uma fatura.","err"); return; }
      const dd=DB.dividas.find(x=>x.id===d.id);
      if(!dd){ toast("Esta dívida foi alterada em outro aparelho.","err"); closeModal(); render(); return; }
      marc.forEach(i=>{ if(dd.faturas && dd.faturas[i]) dd.faturas[i].paga=true; });
      dd.valorPago=(dd.faturas||[]).filter(f=>f.paga).reduce((a,f)=>a+(f.valor||0),0);
      const quitou=dividaAberto(dd)<=0;
      salvar(); closeModal(); render(); toast(quitou?"Dívida quitada! 🎉":"Fatura(s) registrada(s).");
    };
    return;
  }
  /* valor único: lança um valor pago */
  openModal(`${modalHead("Registrar pagamento")}
  <div class="modal-body">
    <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:12px">Quanto você pagou de <strong>${escapeHtml(d.nome)}</strong>? Em aberto: <strong class="num">${fmt(ab)}</strong>.</div>
    <div class="field"><label>Valor pago</label><input id="pVal" inputmode="decimal" placeholder="0,00" autofocus></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="pSave">Registrar</button></div>
  </div>`);
  document.getElementById("pSave").onclick=()=>{
    const v=parseValor(document.getElementById("pVal").value);
    if(v<=0){ toast("Informe um valor.","err"); return; }
    const dd=DB.dividas.find(x=>x.id===d.id);
    if(!dd){ toast("Esta dívida foi alterada em outro aparelho.","err"); closeModal(); render(); return; }
    dd.valorPago=Math.min((dd.valorPago||0)+v, dd.valorTotal||0);
    const quitou=dividaAberto(dd)<=0;
    salvar(); closeModal(); render(); toast(quitou?"Dívida quitada! 🎉":"Pagamento registrado.");
  };
}
/* quitação antecipada à vista de uma dívida parcelada (com juros amortizados) */
function modalQuitarAVista(id){
  const d=DB.dividas.find(x=>x.id===id); if(!d) return;
  const info=dividaQuitacao(d);
  if(!info){ toast("Informe o valor de quitação à vista ao editar a dívida.","err"); return; }
  const jaPago=d.valorPago||0;
  openModal(`${modalHead("Quitar à vista")}
  <div class="modal-body">
    <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:14px;line-height:1.5">Liquidar <strong>${escapeHtml(d.nome)}</strong> hoje, pagando o valor de quitação com os juros futuros amortizados.</div>
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px"><span style="color:var(--ink-soft)">Parcelas restantes (nominal)</span><span class="num">${fmt(info.nominal)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px"><span style="color:var(--ink-soft)">Valor de quitação à vista</span><span class="num" style="color:var(--brand-dark)">${fmt(info.valor)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;border-top:1px dashed var(--border);padding-top:7px"><span style="color:var(--ink-soft)">Economia de juros</span><span class="num pos">${fmt(info.economia)}</span></div>
    </div>
    <div style="font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-bottom:14px;line-height:1.45">Ao confirmar, a dívida será marcada como quitada e o valor efetivamente pago no total passará a ser ${fmt(jaPago+info.valor)} (em vez dos ${fmt((d.valorTotal||0))} nominais).</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="qSave">Confirmar quitação · ${fmt(info.valor)}</button></div>
  </div>`);
  document.getElementById("qSave").onclick=()=>{
    const dd=DB.dividas.find(x=>x.id===d.id);
    if(!dd){ toast("Esta dívida foi alterada em outro aparelho.","err"); closeModal(); render(); return; }
    // fecha todas as parcelas e ajusta o total para refletir o custo real (com desconto dos juros)
    dd.parcelasPagas=dd.parcelasTotal||dd.parcelasPagas||0;
    dd.valorTotal=jaPago+info.valor;
    dd.valorPago=dd.valorTotal;
    dd.valorQuitacao=0;
    salvar(); closeModal(); render(); toast("Dívida quitada à vista! 🎉");
  };
}

/* ---- backup / restaurar ---- */
function modalBackup(){
  openModal(`${modalHead("Backup e restauração")}
  <div class="modal-body">
    <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:16px;line-height:1.5">
      Seus dados ficam salvos automaticamente neste arquivo (no navegador). Para mover entre computadores ou guardar uma cópia de segurança, exporte um backup.
    </div>
    <button class="btn btn-primary" id="bkJson" style="width:100%;justify-content:center;margin-bottom:10px">⬇️ Baixar backup (.json)</button>
    <button class="btn btn-ghost" id="bkExcel" style="width:100%;justify-content:center;margin-bottom:10px">📊 Exportar para Excel (.xlsx)</button>
    <label class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:18px;cursor:pointer">📤 Restaurar backup (.json)
      <input type="file" id="bkRestore" accept=".json" style="display:none"></label>
    <div style="border-top:1px solid var(--border-soft);padding-top:14px">
      <button class="btn btn-ghost" id="bkReset" style="width:100%;justify-content:center;color:var(--expense);border-color:var(--expense-soft)">🗑️ Apagar todos os dados</button>
    </div>
  </div>`);
  document.getElementById("bkJson").onclick=()=>{ baixarJSON(); };
  document.getElementById("bkExcel").onclick=()=>{ exportarExcel(); };
  document.getElementById("bkReset").onclick=()=>{
    if(confirm("Tem certeza? Isso apagará TODAS as contas, lançamentos, investimentos, orçamentos e objetivos. Esta ação não pode ser desfeita.")){
      DB=novoBanco(); salvar(); closeModal(); render(); toast("Dados apagados. Começando do zero.");
    }
  };
  document.getElementById("bkRestore").onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.contas||!d.transacoes){ toast("Arquivo inválido.","err"); return; }
      DB=d; salvar(); closeModal(); render(); toast("Backup restaurado com sucesso.");
    }catch(err){ toast("Não foi possível ler o arquivo.","err"); } };
    r.readAsText(file);
  };
}
function baixarJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`backup-financas-${hoje()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast("Backup baixado.");
}

/* ---- exportar excel ---- */
function exportarExcel(){
  if(typeof XLSX==="undefined"){ toast("Exportação indisponível offline. Recarregue a página com internet.","err"); return; }
  const wb=XLSX.utils.book_new();
  // Transações
  const tipoLabel={receita:"Receita",despesa:"Despesa",transferencia:"Transferência"};
  const tx=DB.transacoes.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(t=>({
    Data:dataBR(t.data), Tipo:tipoLabel[t.tipo]||t.tipo,
    Descrição:t.descricao||(t.tipo==="transferencia"?"Transferência":catNome(t.categoriaId)),
    Categoria:t.tipo==="transferencia"?"—":catNome(t.categoriaId),
    Conta:contaNome(t.contaId),
    Destino:t.tipo==="transferencia"?contaNome(t.contaDestinoId):"",
    Status:t.status==="pendente"?"Pendente":"Efetivada",
    Valor:t.tipo==="transferencia"?t.valor:(t.tipo==="receita"?1:-1)*t.valor
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tx.length?tx:[{Aviso:"Sem lançamentos"}]), "Transações");
  // Contas
  const _mkEx=state.mes;
  const contas=DB.contas.map(c=>({Conta:c.nome,Instituição:(getBanco(c.banco)?.nome)||"—",Tipo:c.tipo,"Saldo inicial":c.saldoInicial,"Saldo atual":saldoConta(c.id),"Previsto fim do mês":saldoContaPrevisto(c.id,_mkEx),"No consolidado":c.consolidar!==false?"Sim":"Não"}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(contas.length?contas:[{Aviso:"Sem contas"}]), "Contas");
  // Investimentos
  const inv=DB.investimentos.map(i=>({Investimento:i.nome,Tipo:i.tipo,Instituição:i.instituicao||"","Aplicado":i.valorAplicado,"Atual":i.valorAtual,"Rendimento":(i.valorAtual-i.valorAplicado)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inv.length?inv:[{Aviso:"Sem investimentos"}]), "Investimentos");
  // Orçamento (mês atual)
  const mk=state.mes;
  const orcRows=DB.categorias.filter(c=>c.tipo==="despesa").map(c=>{
    const o=DB.orcamentos.find(o=>o.categoriaId===c.id); const orcv=o?o.valorOrcado:0; const real=realizadoCat(c.id,mk);
    return {Categoria:c.nome,Orçado:orcv,Realizado:real,Disponível:orcv-real};
  }).filter(r=>r.Orçado>0||r.Realizado>0);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(orcRows.length?orcRows:[{Aviso:"Sem orçamento"}]), "Orçamento "+mk);
  // Objetivos
  const obj=DB.objetivos.map(o=>({Objetivo:o.nome,"Meta":o.valorAlvo,"Guardado":o.valorAtual,"Falta":Math.max(o.valorAlvo-o.valorAtual,0),"% concluído":(o.valorAlvo>0?(o.valorAtual/o.valorAlvo*100):0).toFixed(1)+"%",Prazo:o.prazo?dataBR(o.prazo):""}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(obj.length?obj:[{Aviso:"Sem objetivos"}]), "Objetivos");
  // Dívidas
  const div=DB.dividas.map(d=>({Dívida:d.nome,Credor:d.credor||"",Tipo:dividaModoLabel(d),Detalhe:dividaDetalhe(d),"Valor total":d.valorTotal,"Pago":d.valorPago,"Em aberto":dividaAberto(d),"% quitado":(d.valorTotal>0?(d.valorPago/d.valorTotal*100):0).toFixed(1)+"%",Vencimento:d.vencimento?dataBR(d.vencimento):""}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(div.length?div:[{Aviso:"Sem dívidas"}]), "Dívidas");
  // Recorrências (fixas)
  const rec=DB.recorrencias.map(r=>({
    Tipo:r.tipo==="receita"?"Receita":"Despesa",
    Descrição:r.descricao||catNome(r.categoriaId),
    Categoria:catNome(r.categoriaId), Conta:contaNome(r.contaId),
    Frequência:(FREQS[r.frequencia]&&FREQS[r.frequencia].nome)||r.frequencia,
    Valor:(r.tipo==="receita"?1:-1)*r.valor,
    "Equiv. mensal":(r.tipo==="receita"?1:-1)*equivMensal(r),
    Início:dataBR(r.dataInicio),
    "Repetir até":r.dataFim?dataBR(r.dataFim):"Indefinido",
    Status:r.ativa?"Ativa":"Pausada"
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rec.length?rec:[{Aviso:"Sem recorrências"}]), "Recorrências");
  // Fluxo mensal do ano
  const fm=fluxoMensal(Number(mk.slice(0,4))).map(d=>({Mês:MESES[d.mes-1],Receitas:d.rec,Despesas:d.desp,Resultado:d.rec-d.desp,"Saldo acumulado":d.saldo}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fm), "Fluxo "+mk.slice(0,4));
  XLSX.writeFile(wb,`financas-${hoje()}.xlsx`);
  toast("Planilha Excel exportada.");
}

/* ---- seletor rápido de mês/ano (toque na data) ---- */
let _mpickEsc=null;
function fecharSeletorMes(){ document.querySelectorAll(".mpick-back").forEach(e=>e.remove()); if(_mpickEsc){ document.removeEventListener("keydown",_mpickEsc); _mpickEsc=null; } }
function abrirSeletorMes(anchor){
  if(document.querySelector(".mpick-back")){ fecharSeletorMes(); return; }
  const [cy,cm]=state.mes.split("-").map(Number);
  const hy=Number(hoje().slice(0,4)), hm=Number(hoje().slice(5,7));
  let py=cy, modo="meses";
  const back=document.createElement("div"); back.className="mpick-back";
  const pop=document.createElement("div"); pop.className="mpick";
  back.appendChild(pop); document.body.appendChild(back);
  const r=anchor.getBoundingClientRect();
  pop.style.top=(r.bottom+8)+"px";
  pop.style.left=Math.max(10,Math.min(r.left+r.width/2-140, window.innerWidth-290))+"px";
  const aplicar=mk=>{ state.mes=mk; fecharSeletorMes(); render(); };
  function draw(){
    if(modo==="meses"){
      pop.innerHTML=`<div class="mpick-head">
          <button class="nav" data-y="-1" title="Ano anterior">‹</button>
          <button class="mpick-title" data-mode="anos" title="Escolher o ano">${py}</button>
          <button class="nav" data-y="1" title="Próximo ano">›</button>
        </div>
        <div class="mpick-grid">${MES_ABR.map((nm,i)=>{const mm=i+1;const on=(py===cy&&mm===cm);const today=(py===hy&&mm===hm);return `<button data-m="${mm}" class="${on?"on":""} ${today?"today":""}">${nm}</button>`;}).join("")}</div>
        <div class="mpick-foot"><button data-hoje>Ir para ${nomeMes(hoje().slice(0,7))}</button></div>`;
    } else {
      const start=py-5;
      let cells="";
      for(let y=start;y<start+12;y++) cells+=`<button data-year="${y}" class="${y===cy?"on":""} ${y===hy?"today":""}">${y}</button>`;
      pop.innerHTML=`<div class="mpick-head">
          <button class="nav" data-y="-12" title="12 anos antes">‹</button>
          <button class="mpick-title" data-mode="meses">${start}–${start+11}</button>
          <button class="nav" data-y="12" title="12 anos depois">›</button>
        </div>
        <div class="mpick-grid">${cells}</div>
        <div class="mpick-foot"><button data-hoje>Ir para ${nomeMes(hoje().slice(0,7))}</button></div>`;
    }
    pop.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ py+=Number(b.dataset.y); draw(); });
    pop.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ modo=b.dataset.mode; draw(); });
    pop.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>aplicar(`${py}-${String(b.dataset.m).padStart(2,"0")}`));
    pop.querySelectorAll("[data-year]").forEach(b=>b.onclick=()=>{ py=Number(b.dataset.year); modo="meses"; draw(); });
    const hb=pop.querySelector("[data-hoje]"); if(hb) hb.onclick=()=>aplicar(hoje().slice(0,7));
  }
  back.onclick=e=>{ if(e.target===back) fecharSeletorMes(); };
  _mpickEsc=ev=>{ if(ev.key==="Escape") fecharSeletorMes(); };
  document.addEventListener("keydown",_mpickEsc);
  draw();
}

let _fbAuth=null, _fbDB=null, _fbUser=null, _docRef=null, _unsub=null;
let _pushTimer=null, _ultimoEnvioTs=0, _primeiraSync=true, _aplicandoRemoto=false;

function nuvemConfigurada(){
  return firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("COLE_AQUI");
}
function setSyncStatus(estado, texto){
  const el=document.getElementById("syncChip"); if(!el) return;
  el.dataset.state=estado;
  const t=el.querySelector(".sync-txt"); if(t) t.textContent=texto;
}
function mostrarGate(v){

}

/* ---- envio (gravação na nuvem), com debounce ---- */
function nuvemAgendarEnvio(){
  if(!_docRef || _aplicandoRemoto) return;
  setSyncStatus("sync","Salvando…");
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(nuvemEnviar, 900);
}
/* iOS congela timers ao trocar de app/bloquear a tela: envia imediatamente o que
   estiver pendente no debounce para a última edição não ficar só neste aparelho. */
function nuvemFlush(){
  if(_pushTimer){ clearTimeout(_pushTimer); _pushTimer=null; nuvemEnviar(); }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") nuvemFlush(); });
window.addEventListener("pagehide",nuvemFlush);
function nuvemEnviar(){
  if(!_docRef) return;
  _ultimoEnvioTs = DB.updatedAt || Date.now();
  _docRef.set({
    json: JSON.stringify(DB),
    updatedAt: _ultimoEnvioTs,
    atualizadoEm: new Date().toISOString()
  }).then(()=>{
    setSyncStatus(navigator.onLine?"ok":"off", navigator.onLine?"Sincronizado":"Offline (salvo aqui)");
  }).catch(e=>{
    setSyncStatus("err","Erro ao salvar");
    console.warn("Falha ao enviar para a nuvem:", e);
  });
}

/* ---- recepção (dados vindos da nuvem) ---- */
function nuvemAplicarRemoto(dadosJson){
  let d; try{ d=JSON.parse(dadosJson); }catch(e){ return; }
  if(!d || !d.contas) return;
  _aplicandoRemoto=true;
  DB=d;
  DB.contas ||= []; DB.categorias ||= []; DB.transacoes ||= [];
  DB.investimentos ||= []; DB.orcamentos ||= []; DB.objetivos ||= []; DB.recorrencias ||= [];
  DB.recorrencias.forEach(r=>{ r.puladas ||= []; });
  if(typeof DB.updatedAt!=="number") DB.updatedAt=0;
  safeSet(JSON.stringify(DB));     // grava local SEM reenviar
  _aplicandoRemoto=false;
  if(typeof render==="function") render();
}
function nuvemOnSnapshot(snap){
  const local = DB.updatedAt || 0;
  if(!snap.exists){
    if(_primeiraSync){ _primeiraSync=false; nuvemEnviar(); }  // nuvem vazia → semeia
    else setSyncStatus("ok","Sincronizado");
    return;
  }
  const data = snap.data() || {};
  const remoto = data.updatedAt || 0;
  _primeiraSync=false;
  if(remoto > local && data.json){
    nuvemAplicarRemoto(data.json);        // nuvem mais nova → adota
    setSyncStatus("ok","Sincronizado");
  } else if(local > remoto){
    nuvemEnviar();                         // o daqui é mais novo → envia
  } else {
    setSyncStatus("ok","Sincronizado");    // iguais (inclui eco do próprio envio)
  }
}

/* ---- autenticação ---- */
function mensagemAuth(code){
  return ({
    "auth/invalid-email":"E-mail inválido.",
    "auth/missing-password":"Digite a senha.",
    "auth/wrong-password":"Senha incorreta.",
    "auth/invalid-credential":"E-mail ou senha incorretos.",
    "auth/user-not-found":"Conta não encontrada. Toque em “Criar conta”.",
    "auth/email-already-in-use":"Este e-mail já tem conta. Toque em “Entrar”.",
    "auth/weak-password":"Senha fraca (mínimo de 6 caracteres).",
    "auth/too-many-requests":"Muitas tentativas. Aguarde alguns instantes.",
    "auth/network-request-failed":"Sem conexão com a internet.",
    "auth/operation-not-allowed":"Ative o login por E-mail/Senha no Firebase (Authentication)."
  })[code];
}
function authAcao(modo){
  const email=(document.getElementById("authEmail").value||"").trim();
  const senha=document.getElementById("authSenha").value||"";
  const erro=document.getElementById("authErro"); erro.textContent="";
  if(!email||!senha){ erro.textContent="Preencha e-mail e senha."; return; }
  if(modo==="criar" && senha.length<6){ erro.textContent="A senha precisa ter ao menos 6 caracteres."; return; }
  const p = (modo==="criar")
    ? _fbAuth.createUserWithEmailAndPassword(email,senha)
    : _fbAuth.signInWithEmailAndPassword(email,senha);
  p.catch(e=>{ erro.textContent = mensagemAuth(e.code) || "Não foi possível entrar."; });
}
function nuvemIniciar(){
  if(typeof firebase==="undefined"){
    setSyncStatus("err","Sem conexão");
    mostrarGate(false);
    return; // CDN do Firebase não carregou → segue em modo local
  }
  try{ firebase.initializeApp(firebaseConfig); }catch(e){ console.warn(e); }
  _fbAuth = firebase.auth();
  _fbDB   = firebase.firestore();
  try{ _fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  try{ _fbDB.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}

  document.getElementById("authEntrar").onclick=()=>authAcao("login");
  document.getElementById("authCriar").onclick =()=>authAcao("criar");
  document.getElementById("authSenha").addEventListener("keydown",e=>{ if(e.key==="Enter") authAcao("login"); });
  document.getElementById("btnSair").onclick=()=>{
    if(!confirm("Sair da conta neste aparelho? Seus dados continuam na nuvem e serão removidos deste navegador.")) return;
    nuvemFlush(); // garante que a última edição subiu antes de limpar
    _fbAuth.signOut().then(()=>{
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      memStore=null;
      DB=novoBanco(); DB.updatedAt=0;
      safeSet(JSON.stringify(DB)); // sem salvar(): não deve reenviar à nuvem
      state.secao="dashboard";
      render();
    });
  };
  window.addEventListener("offline",()=>setSyncStatus("off","Offline"));
  window.addEventListener("online", ()=>setSyncStatus("sync","Reconectando…"));

  _fbAuth.onAuthStateChanged(user=>{
    _fbUser=user;
    const acct=document.getElementById("acctBar");
    if(user){
      mostrarGate(false);
      if(acct) acct.style.display="flex";
      const em=document.getElementById("acctEmail"); if(em) em.textContent=user.email||"";
      _docRef=_fbDB.collection("usuarios").doc(user.uid).collection("financas").doc("dados");
      _primeiraSync=true;
      setSyncStatus("sync","Conectando…");
      if(_unsub) _unsub();
      _unsub=_docRef.onSnapshot(nuvemOnSnapshot, err=>{ setSyncStatus("err","Sem conexão"); console.warn(err); });
    }else{
      _docRef=null; if(_unsub){ _unsub(); _unsub=null; }
      if(acct) acct.style.display="none";
      mostrarGate(true);
    }
  });
}

/* ====================================================================
   INICIALIZAÇÃO
==================================================================== */
carregar();
render();
if(nuvemConfigurada()){
  nuvemIniciar();
}else{
  mostrarGate(false);                 // sem nuvem configurada → modo local
  setSyncStatus("off","Modo local");
